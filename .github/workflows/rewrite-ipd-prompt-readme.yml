name: Rewrite IPD prompt README

on:
  push:
    branches: [docs/ipd-context-guide-refresh]

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/ipd-context-guide-refresh
          fetch-depth: 0

      - name: Rewrite README
        run: python scripts/rewrite-ipd-prompt-readme.py

      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ipd/prompts/README.md
          git commit -m "docs(ipd): refresh context guide and prompt examples"
          git push origin HEAD:docs/ipd-context-guide-refresh

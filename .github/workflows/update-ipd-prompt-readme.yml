name: Update IPD prompt README examples

on:
  push:
    branches: [docs/ipd-complete-prompt-examples]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/ipd-complete-prompt-examples
          fetch-depth: 0

      - name: Append complete prompt examples
        run: python scripts/append-ipd-prompt-examples.py

      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ipd/prompts/README.md
          git commit -m "docs(ipd): add complete prompt examples by role"
          git push origin HEAD:docs/ipd-complete-prompt-examples

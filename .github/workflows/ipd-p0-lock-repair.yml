name: IPD P0 lock repair

on:
  push:
    branches:
      - fix/ipd-p0-runtime-safety-delivery

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ipd-p0-runtime-safety-delivery
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore main lockfile and add only IPD sandbox dependency
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- package-lock.json
          python - <<'PY'
          from pathlib import Path
          path = Path('package-lock.json')
          text = path.read_text(encoding='utf-8')
          anchor = '''\t\t"packages/ipd": {\n\t\t\t"name": "@earendil-works/pi-ipd",\n\t\t\t"version": "0.85.1",\n\t\t\t"dependencies": {\n'''
          replacement = anchor + '\t\t\t\t"@anthropic-ai/sandbox-runtime": "0.0.26",\n'
          if replacement not in text:
              if anchor not in text:
                  raise SystemExit('packages/ipd lockfile block not found')
              text = text.replace(anchor, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/ipd-p0-lock-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json .github/workflows/ipd-p0-lock-repair.yml
          git commit -m 'fix(ipd): repair lockfile without platform churn'
          git push origin HEAD:fix/ipd-p0-runtime-safety-delivery

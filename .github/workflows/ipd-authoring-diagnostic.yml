# Temporary PR #17 diagnostic; remove from the final PR diff.
# Lock regeneration is confined to this disposable checkout, never committed.
name: IPD authoring diagnostic
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
concurrency:
  group: authoring-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == 'Nephamaster/pi' && github.event.pull_request.head.ref == 'feat/ipd-workflow-authoring-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Diagnostic dependency resolution (never committed)
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply the reviewed lint corrections
        shell: python
        run: |
          from pathlib import Path
          fixes = [
            ('packages/ipd/src/control/workflow-draft-links.ts',
             'const add = (target: string, path: string) => result.push({ target, path });',
             'const add = (target: string, path: string) => { result.push({ target, path }); };'),
            ('packages/ipd/src/control/workflow-draft-links.ts',
             'refs.forEach((ref, i) => add(portKey(ref), `${path}/${i}`));',
             'refs.forEach((ref, i) => { add(portKey(ref), `${path}/${i}`); });'),
            ('packages/ipd/src/control/workflow-draft-materialize.ts',
             'projected.generatedInputs.forEach((input, inputIndex) => {',
             'projected.generatedInputs.forEach((_input, inputIndex) => {'),
          ]
          for name, old, new in fixes:
            p = Path(name)
            text = p.read_text()
            if old in text:
              assert text.count(old) == 1, name
              p.write_text(text.replace(old, new))
      - name: Format only this PR's IPD TypeScript files
        shell: bash
        run: |
          mapfile -t paths < <(git diff --name-only 7431984e2e9d1e22ed4c4bfa5c48d1da280a562b HEAD -- packages/ipd | grep '\.ts$')
          test "${#paths[@]}" -gt 0
          npx --no-install biome check --write --error-on-warnings --max-diagnostics=1000 "${paths[@]}"
          git add -- "${paths[@]}"
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(ipd): complete authoring lint and formatting corrections'
            git push origin HEAD:refs/heads/feat/ipd-workflow-authoring-v2
          fi
          printf 'Tested implementation commit: '
          git rev-parse HEAD
      - name: Repository checks with diagnostic dependencies
        id: repo_check
        continue-on-error: true
        run: npm run check
      - name: Type check with diagnostic dependencies
        run: npx --no-install tsgo --noEmit
      - name: Expanded IPD regressions (no external model)
        working-directory: packages/ipd
        run: >-
          node ../../node_modules/vitest/dist/cli.js --run
          test/workflow-authoring.test.ts
          test/workflow-authoring-manager.test.ts
          test/workflow-authoring-dashboard.test.ts
          test/workflow-authoring-invariants.test.ts
          test/workflow-draft-storage.test.ts
          test/workflow-draft.test.ts
          test/pi-control-roles.test.ts
          test/compiler.test.ts
          test/contracts.test.ts
          test/control-plane.test.ts
          test/governance-kernel.test.ts
          test/governance-records.test.ts
          test/general-environment.test.ts
          test/optional-run-skill.test.ts
          test/visualization.test.ts
          test/p0-runtime-safety.test.ts
      - name: Record exact validation and dependency boundary
        if: always()
        env:
          ROOT_CHECK: ${{ steps.repo_check.outcome }}
        run: |
          printf 'Root check outcome: %s\n' "$ROOT_CHECK"
          printf 'Diagnostic tests use an ephemeral repaired lock; normal npm-ci verification remains separate.\n'
          git rev-parse HEAD
          sha256sum package-lock.json
          git status --short
          git diff --stat

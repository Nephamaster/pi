# Temporary PR #17 diagnostic; remove from the final PR diff.
# Dependency repair and generated data stay in the disposable checkout.
name: IPD authoring diagnostic
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
concurrency:
  group: authoring-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == 'Nephamaster/pi' && github.event.pull_request.head.ref == 'feat/ipd-workflow-authoring-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Diagnostic dependency resolution (never committed)
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Preserve TypeBox metadata in authoring schema projections
        shell: python
        run: |
          from pathlib import Path
          p = Path('packages/ipd/src/control/workflow-draft-schema.ts')
          text = p.read_text()
          start = text.index('// Clearing a required list')
          end = text.index('export const DraftContractSchema', start)
          replacement = '''// Clearing a required list is a draft edit, but remains incomplete at compilation.
          // TypeBox keeps kind/optional metadata in non-enumerable descriptors. Spreading
          // a schema loses that metadata and can turn projected properties into false schemas.
          const partial = <T extends TObject>(schema: T) => {
          \tconst properties: Record<string, TSchema> = {};
          \tfor (const [key, field] of Object.entries(schema.properties as Record<string, TSchema>)) {
          \t\tconst descriptors: PropertyDescriptorMap = Object.getOwnPropertyDescriptors(field);
          \t\tif (descriptors.type?.value === "array") delete descriptors.minItems;
          \t\tproperties[key] = Object.create(Object.getPrototypeOf(field), descriptors) as TSchema;
          \t}
          \tconst descriptors: PropertyDescriptorMap = Object.getOwnPropertyDescriptors(schema);
          \tdescriptors.properties = { ...descriptors.properties, value: properties };
          \tconst copy = Object.create(Object.getPrototypeOf(schema), descriptors) as T;
          \treturn Type.Partial(copy, { additionalProperties: false });
          };
          '''
          p.write_text(text[:start] + replacement + text[end:])
          p = Path('packages/ipd/test/workflow-authoring-schema.test.ts')
          p.write_text('''import { describe, expect, it } from "vitest";
          import { ExecutionNodeSchema, NodeAgentConfigSchema, OutputDefinitionSchema, WorkflowDefinitionSchema } from "../src/contracts/workflow.ts";
          import { DraftAgentSchema, DraftCommandSchema, DraftContractSchema, DraftOutputSchema, AuthoringDraftSchema } from "../src/control/workflow-draft-schema.ts";
          import { importLegacyDraft } from "../src/control/workflow-draft-import.ts";
          import { validateSchema } from "../src/ir/validation.ts";
          import { createValidWorkflow } from "./fixtures.ts";
          describe("authoring Schema metadata preservation", () => {
          \tit("accepts actual employee and output fields without widening permissions", () => {
          \t\tconst workflow = createValidWorkflow();
          \t\tconst producer = workflow.nodes[0];
          \t\tif (producer.kind !== "execution") throw new Error("Invalid fixture");
          \t\tconst { criterion_refs: _refs, ...output } = producer.outputs[0];
          \t\texpect(validateSchema(DraftAgentSchema, producer.agents[0]).ok).toBe(true);
          \t\texpect(validateSchema(DraftOutputSchema, output).ok).toBe(true);
          \t\texpect(validateSchema(DraftAgentSchema, { ...producer.agents[0], system_prompt_addendum: "bypass" }).ok).toBe(false);
          \t\texpect(validateSchema(DraftOutputSchema, { ...output, artifact_type: 42 }).ok).toBe(false);
          \t});
          \tit("defers draft completeness without mutating the execution contract", () => {
          \t\tconst workflow = createValidWorkflow();
          \t\tconst contract = { ...workflow.nodes[0].contract, responsibilities: [] };
          \t\texpect(validateSchema(DraftContractSchema, contract).ok).toBe(true);
          \t\texpect(validateSchema(ExecutionNodeSchema.properties.contract, contract).ok).toBe(false);
          \t\texpect(ExecutionNodeSchema.properties.contract.properties.responsibilities.minItems).toBe(1);
          \t\texpect(validateSchema(NodeAgentConfigSchema, {}).ok).toBe(false);
          \t\texpect(validateSchema(OutputDefinitionSchema, { output_id: "x" }).ok).toBe(false);
          \t\texpect(validateSchema(WorkflowDefinitionSchema, workflow).ok).toBe(true);
          \t});
          \tit("retains domain parameter types and rejects mixed or injected fields", () => {
          \t\texpect(validateSchema(DraftCommandSchema, { domain: "configure_nodes", data: { nodes: [{ node_id: "produce", employee: { agent_ref: { id: "producer", version: "1.0.0" } } }] } }).ok).toBe(true);
          \t\texpect(validateSchema(DraftCommandSchema, { domain: "configure_nodes", data: { nodes: [{ node_id: "produce", employee: { agent_ref: { id: "producer", version: 3 } } }] } }).ok).toBe(false);
          \t\texpect(validateSchema(DraftCommandSchema, { domain: "outputs", data: { upsert: [{ node_id: "produce", output_id: "out", criterion_refs: ["hidden"] }] } }).ok).toBe(false);
          \t});
          \tit("can persist a lossless imported fixture with original strict fields", () => {
          \t\tconst { nodes, criteria, completion, requirement_coverage, task_input_ref, process_selection_ref, ...header } = createValidWorkflow();
          \t\tconst draft = importLegacyDraft({ draftId: "run-1:workflow-draft", runId: "run-1", revision: 1, trustedReferences: { task_input_ref, process_selection_ref }, header, nodes, criteria, requirementCoverage: requirement_coverage, completion, operations: {} });
          \t\tconst result = validateSchema(AuthoringDraftSchema, draft);
          \t\texpect(result.ok ? [] : result.diagnostics).toEqual([]);
          \t});
          });
          ''')
      - name: Format and commit only PR-owned TypeScript corrections
        shell: bash
        run: |
          mapfile -t paths < <(git diff --name-only 7431984e2e9d1e22ed4c4bfa5c48d1da280a562b HEAD -- packages/ipd | grep '\.ts$')
          paths+=(packages/ipd/test/workflow-authoring-schema.test.ts)
          npx --no-install biome check --write --error-on-warnings --max-diagnostics=1000 "${paths[@]}"
          git add -- "${paths[@]}"
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(ipd): preserve TypeBox schema metadata in partial authoring contracts'
            git push origin HEAD:refs/heads/feat/ipd-workflow-authoring-v2
          fi
          git rev-parse HEAD
      - name: Hydrate ignored model catalog
        run: npm --prefix packages/ai run hydrate-model-data
      - name: Type check
        id: typecheck
        continue-on-error: true
        run: npx --no-install tsgo --noEmit
      - name: Expanded IPD regressions
        id: regressions
        working-directory: packages/ipd
        run: >-
          node ../../node_modules/vitest/dist/cli.js --run --reporter=verbose
          test/workflow-authoring-schema.test.ts
          test/workflow-authoring.test.ts
          test/workflow-authoring-manager.test.ts
          test/workflow-authoring-dashboard.test.ts
          test/workflow-authoring-invariants.test.ts
          test/workflow-draft-storage.test.ts
          test/workflow-draft.test.ts
          test/pi-control-roles.test.ts
          test/compiler.test.ts
          test/control-plane.test.ts
          test/governance-kernel.test.ts
          test/governance-records.test.ts
          test/general-environment.test.ts
          test/optional-run-skill.test.ts
          test/visualization.test.ts
          test/p0-runtime-safety.test.ts
      - name: Reproduce unchanged legacy contract fixture on head and base
        if: always() && steps.regressions.outcome != 'skipped'
        shell: bash
        run: |
          set +e
          (cd packages/ipd && node ../../node_modules/vitest/dist/cli.js --run test/contracts.test.ts --reporter=verbose) > /tmp/contracts-head.log 2>&1
          head_rc=$?
          git worktree add --detach /tmp/pi-authoring-base 7431984e2e9d1e22ed4c4bfa5c48d1da280a562b
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/pi-authoring-base/node_modules
          cp -a packages/ai/src/providers/data/. /tmp/pi-authoring-base/packages/ai/src/providers/data/
          (cd /tmp/pi-authoring-base/packages/ipd && node "$GITHUB_WORKSPACE/node_modules/vitest/dist/cli.js" --run test/contracts.test.ts --reporter=verbose) > /tmp/contracts-base.log 2>&1
          base_rc=$?
          printf 'Unchanged contracts test: head=%s base=%s\n' "$head_rc" "$base_rc"
          tail -45 /tmp/contracts-head.log
          tail -45 /tmp/contracts-base.log
          exit 0
      - name: Full repository check (separate baseline status)
        id: repo_check
        if: always() && steps.regressions.outcome != 'skipped'
        continue-on-error: true
        run: |
          if npm run check > /tmp/ipd-root-check.log 2>&1; then tail -35 /tmp/ipd-root-check.log; else tail -80 /tmp/ipd-root-check.log; exit 1; fi
      - name: Record exact validation boundary
        if: always()
        env:
          TYPE_CHECK: ${{ steps.typecheck.outcome }}
          REGRESSIONS: ${{ steps.regressions.outcome }}
          ROOT_CHECK: ${{ steps.repo_check.outcome }}
        run: |
          printf 'TypeScript=%s; IPD regressions=%s; root check=%s\n' "$TYPE_CHECK" "$REGRESSIONS" "$ROOT_CHECK"
          git rev-parse HEAD
          sha256sum package-lock.json
          git status --short
          printf 'Temporary dependency resolution, no paid-model or Docker tests.\n'
          test "$TYPE_CHECK" = success
          test "$REGRESSIONS" = success

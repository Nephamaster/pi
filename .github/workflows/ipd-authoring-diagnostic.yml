# Temporary PR #17 diagnostic; removed after final verification.
# No repository files are committed by this workflow.
name: IPD authoring diagnostic
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: authoring-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == 'Nephamaster/pi' && github.event.pull_request.head.ref == 'feat/ipd-workflow-authoring-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Diagnostic dependency resolution (never committed)
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Check only PR-owned TypeScript without rewriting
        shell: bash
        run: |
          mapfile -t paths < <(git diff --name-only 7431984e2e9d1e22ed4c4bfa5c48d1da280a562b HEAD -- packages/ipd | grep '\.ts$')
          npx --no-install biome check --error-on-warnings "${paths[@]}"
          git diff --check
      - name: Hydrate ignored model catalog
        run: npm --prefix packages/ai run hydrate-model-data
      - name: Type check
        run: npx --no-install tsgo --noEmit
      - name: Expanded IPD regressions
        working-directory: packages/ipd
        run: >-
          node ../../node_modules/vitest/dist/cli.js --run --reporter=verbose
          test/workflow-authoring-schema.test.ts
          test/workflow-authoring.test.ts
          test/workflow-authoring-manager.test.ts
          test/workflow-authoring-dashboard.test.ts
          test/workflow-authoring-invariants.test.ts
          test/workflow-draft-storage.test.ts
          test/workflow-draft.test.ts
          test/pi-control-roles.test.ts
          test/compiler.test.ts
          test/control-plane.test.ts
          test/governance-kernel.test.ts
          test/governance-records.test.ts
          test/general-environment.test.ts
          test/optional-run-skill.test.ts
          test/visualization.test.ts
          test/p0-runtime-safety.test.ts
      - name: Compare unchanged legacy contract fixture with base
        shell: bash
        run: |
          set +e
          (cd packages/ipd && node ../../node_modules/vitest/dist/cli.js --run test/contracts.test.ts --reporter=verbose) > /tmp/contracts-head.log 2>&1
          head_rc=$?
          git worktree add --detach /tmp/pi-authoring-base 7431984e2e9d1e22ed4c4bfa5c48d1da280a562b
          worktree_rc=$?
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/pi-authoring-base/node_modules
          cp -a packages/ai/src/providers/data/. /tmp/pi-authoring-base/packages/ai/src/providers/data/
          (cd /tmp/pi-authoring-base/packages/ipd && node "$GITHUB_WORKSPACE/node_modules/vitest/dist/cli.js" --run test/contracts.test.ts --reporter=verbose) > /tmp/contracts-base.log 2>&1
          base_rc=$?
          set -e
          printf 'Unchanged contracts fixture: head=%s base=%s\n' "$head_rc" "$base_rc"
          tail -40 /tmp/contracts-head.log
          tail -40 /tmp/contracts-base.log
          test "$worktree_rc" -eq 0
          test "$head_rc" -eq 1
          test "$base_rc" -eq 1
          grep -F '1 failed | 1 passed (2)' /tmp/contracts-head.log
          grep -F '1 failed | 1 passed (2)' /tmp/contracts-base.log
          grep -F 'accepts the minimum TaskInput and ProcessSpec handoff' /tmp/contracts-head.log
          grep -F 'accepts the minimum TaskInput and ProcessSpec handoff' /tmp/contracts-base.log
      - name: Full repository check with diagnostic dependencies
        run: |
          if npm run check > /tmp/ipd-root-check.log 2>&1; then tail -40 /tmp/ipd-root-check.log; else tail -100 /tmp/ipd-root-check.log; exit 1; fi
      - name: Verify repository check did not rewrite implementation
        shell: bash
        run: |
          git status --short
          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              package-lock.json|packages/ipd/test/presentation-template.test.ts) ;;
              *) echo "Unexpected uncommitted change: $path"; exit 1 ;;
            esac
          done
          printf 'Verified implementation: '
          git rev-parse HEAD
          sha256sum package-lock.json
          printf 'Temporary lock resolution only; standard npm-ci CI remains independently reported.\n'

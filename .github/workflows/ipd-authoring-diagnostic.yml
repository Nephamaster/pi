# Temporary PR #17 diagnostic; remove from the final PR diff.
# Lock regeneration is confined to this disposable checkout, not committed.
name: IPD authoring diagnostic
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
concurrency:
  group: authoring-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == 'Nephamaster/pi' && github.event.pull_request.head.ref == 'feat/ipd-workflow-authoring-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Diagnostic dependency resolution (never committed)
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Format only this PR's IPD TypeScript files
        shell: bash
        run: |
          mapfile -t paths < <(git diff --name-only 7431984e2e9d1e22ed4c4bfa5c48d1da280a562b HEAD -- packages/ipd | grep '\.ts$')
          test "${#paths[@]}" -gt 0
          npx --no-install biome check --write --max-diagnostics=1000 "${paths[@]}"
          git add -- "${paths[@]}"
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: format authoring invariants'
            git push origin HEAD:refs/heads/feat/ipd-workflow-authoring-v2
          fi
      - name: Type check with diagnostic dependencies
        run: npx --no-install tsgo --noEmit
      - name: Targeted IPD regressions (no external model)
        working-directory: packages/ipd
        run: >-
          npx --no-install vitest run
          test/workflow-authoring.test.ts
          test/workflow-authoring-manager.test.ts
          test/workflow-authoring-dashboard.test.ts
          test/workflow-authoring-invariants.test.ts
          test/workflow-draft-storage.test.ts
          test/workflow-draft.test.ts
          test/pi-control-roles.test.ts
      - name: Record diagnostic dependency boundary
        if: always()
        run: |
          printf 'Diagnostic tests use an ephemeral repaired lock; normal npm-ci verification is unchanged.\n'
          git status --short

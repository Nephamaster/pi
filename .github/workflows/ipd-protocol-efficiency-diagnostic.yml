name: IPD protocol efficiency diagnostic
on:
  push:
    branches: [fix/ipd-protocol-efficiency]
    paths: ['.github/workflows/ipd-protocol-efficiency-diagnostic.yml']
permissions:
  contents: read
concurrency:
  group: ipd-protocol-efficiency-diagnostic
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7c6b01e98bb9bc4f2a69a5fae41949898b7f104c
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Record fixed implementation
        run: git rev-parse HEAD
      - name: Resolve diagnostic dependencies without committing lock changes
        run: |
          sha256sum package-lock.json
          npm install --package-lock-only --ignore-scripts
          sha256sum package-lock.json
          npm ci --ignore-scripts
      - name: Hydrate existing ignored model data
        run: npm run hydrate:model-data
      - name: Full repository check
        id: check
        run: npm run check
      - name: Authoring, evidence, Session, and local-rework regressions
        id: tests
        working-directory: packages/ipd
        run: >-
          node ../../node_modules/vitest/dist/cli.js --run
          test/protocol-efficiency.test.ts
          test/authoring-source-efficiency.test.ts
          test/submission-correction-session.test.ts
          test/structured-submissions.test.ts
          test/pi-node-worker.test.ts
          test/pi-control-roles.test.ts
          test/workflow-authoring.test.ts
          test/workflow-authoring-manager.test.ts
          test/workflow-authoring-invariants.test.ts
          test/workflow-authoring-schema.test.ts
          test/workflow-authoring-dashboard.test.ts
          test/workflow-draft-storage.test.ts
          test/compiler.test.ts
          test/review-validation.test.ts
          test/review-evidence-store.test.ts
          test/submission-store.test.ts
          test/submission-diagnostics.test.ts
          test/governance-kernel.test.ts
          test/round-invalidation.test.ts
          test/runtime-rework.test.ts
      - name: Verify no checked implementation file was rewritten
        if: always()
        run: |
          git status --short
          git diff --exit-code -- packages/ipd/src packages/ipd/prompts packages/ipd/assets/skills/workflow-design packages/ipd/test/protocol-efficiency.test.ts packages/ipd/test/authoring-source-efficiency.test.ts packages/ipd/test/submission-correction-session.test.ts packages/ipd/test/workflow-authoring.test.ts

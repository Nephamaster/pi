schema_version: 2
process_spec_id: project-reviewed-content-delivery
version: 2.0.0
name: Reviewed Content Development and Delivery
description: >-
  A development and delivery process for reports, proposals, explanatory materials, presentations, and other formal content
  artifacts. The process begins with clear requirements and usage context, then proceeds through development planning, deliverable
  design, content development, artifact production, inspection and validation, and formal delivery. Each stage produces an
  inspectable result and uses an appropriate review to confirm quality before downstream use. The process emphasizes requirement
  coverage, factual and numerical correctness, coherent information structure, consistent expression, usable final artifacts,
  and clear traceability of the definitive delivery version.
source: >-
  Project-derived specification. The process skeleton references the historical Huawei documentation-development sequence
  of requirement analysis, documentation planning, deliverable design, documentation development, inspection and verification,
  and documentation release, then refines it with general content-production practices for activities, deliverables, capability
  requirements, evidence, and review criteria. This specification is intended for formal content-development scenarios and
  is not an official current Huawei IPD template.
default_executable: true

applicable_when:
- The task must produce a formal, deliverable, and independently inspectable content artifact, such as a report, 
  proposal, explanatory document, presentation, or coordinated content package.
- Result quality depends on requirement coverage, factual or numerical correctness, content organization, communication 
  quality, and usability of the final files.
- The task contains multiple interdependent content-production steps, and staged confirmation can reduce the risk and 
  cost of large-scale late rework.
- There is a clear recipient, usage scenario, or delivery requirement that can serve as the basis for judging delivery 
  readiness.

not_applicable_when:
- The task only requires immediate Q&A, simple rewriting, short-form generation, one-off information extraction, or 
  another lightweight activity that does not require formal delivery governance.
- The task lacks an identifiable delivery object and intended use and cannot establish a stable inspection basis.
- The primary task belongs to another specialized process such as software engineering, product testing, manufacturing, 
  or experimental research, while content artifacts are only incidental outputs.
- The task requires publishing a final result while critical facts, scope, or acceptance objectives are still too 
  unclear to support a stable delivery baseline.

required_activities:
- activity_id: requirements-analysis
  description: >-
    Requirements and scope analysis. Clarify the delivery objective, target audience, usage scenario, delivery format, content
    scope, input materials, factual and data sources, time and format constraints, and quality requirements. Identify conflicting,
    missing, or unresolved conditions and define what is and is not part of the current delivery. Responsibility is typically
    held by a content owner, requirement analyst, or content-strategy role, with domain specialists contributing factual boundaries
    when necessary.
  required_capabilities:
  - requirements-analysis

- activity_id: development-planning
  description: >-
    Content development planning. Based on the requirements baseline, determine major work items, professional responsibilities,
    material preparation, critical dependencies, staged outputs, review arrangements, and delivery order. Identify in advance
    the responsibilities and input conditions for research, data processing, visual design, formatting/production, or domain
    validation. The plan must represent real dependencies and must not treat unavailable critical inputs as already available.
  required_capabilities:
  - project-planning

- activity_id: deliverable-design
  description: >-
    Deliverable design. Define the information architecture, major content units, narrative or reading sequence, information
    hierarchy, data and visual-expression principles, relationships among sections or pages, and necessary formatting rules.
    The design should directly guide subsequent content development and production while allowing reasonable variation for
    different content types instead of forcing mechanically identical presentation everywhere.
  required_capabilities:
  - proposal-architecture

- activity_id: content-development
  description: >-
    Content development. Produce the research, writing, data processing, chart and visual-content preparation, and cross-section
    integration required by the requirements baseline and deliverable design. Maintain consistency in facts, figures, terminology,
    definitions, and citations, and distinguish confirmed facts from inference and unresolved items. Communication improvement
    must not alter the original business meaning, and information gaps must not be filled with unsupported content.
  required_capabilities:
  - content-creation

- activity_id: artifact-production
  description: >-
    Artifact production and integration. Turn the developed content into a complete artifact in the target medium and delivery
    format, including layout, graphic integration, formatting, file organization, and necessary editable-source preparation.
    Production must preserve consistency with approved content and source material and avoid introducing numerical errors,
    omissions, mixed versions, or unmaintainable manual changes during conversion and visual refinement.
  required_capabilities:
  - ui-implementation

- activity_id: inspection-validation
  description: >-
    Inspection and validation. Check a definitive version of the content and artifact for requirement coverage, factual and
    numerical correctness, citations and evidence, structural completeness, cross-part consistency, language and visual expression,
    format integrity, and usability in the intended scenario. Correct discovered issues and revalidate affected content. Explicitly
    distinguish completed, unperformed, and impossible checks; unverified items must not be treated as passed.
  required_capabilities:
  - test-results-analysis

- activity_id: release-delivery
  description: >-
    Release and delivery. Organize the definitive validated version, ensure that formal files, editable sources, attachments,
    citations, version information, and necessary usage instructions correspond correctly, remove obsolete or confusing intermediate
    versions, and form a complete delivery package for the recipient. Any known limitations, unresolved items, or usage preconditions
    must be disclosed with the delivery.
  required_capabilities:
  - release-engineering

required_deliverables:
- deliverable_id: requirements-baseline
  activity_id: requirements-analysis
  artifact_type: content-requirements
  description: >-
    Content requirements baseline. At minimum covers the delivery objective, target audience, usage context, delivery scope,
    input materials, factual and data sources, explicit constraints, format and quality requirements, and unresolved items
    that may affect downstream work.
  evidence_requirements:
  - evidence_requirement_id: requirements-baseline.evidence.1
    description: Each critical requirement is traceable to the user request, formal materials, or an explicit business 
      source.
  - evidence_requirement_id: requirements-baseline.evidence.2
    description: Objective, audience, usage scenario, and delivery scope are mutually consistent with no unresolved 
      material conflict.
  - evidence_requirement_id: requirements-baseline.evidence.3
    description: Missing information and unresolved items are recorded separately, together with their impact on 
      downstream content development or delivery.
  - evidence_requirement_id: requirements-baseline.evidence.4
    description: Out-of-scope content is explicitly stated to prevent uncontrolled scope expansion during development.

- deliverable_id: development-plan
  activity_id: development-planning
  artifact_type: content-development-plan
  description: >-
    Content development plan. Describes major work items, responsible professional roles, required inputs, critical dependencies,
    staged outputs, review arrangements, and delivery order, and lists research material, data, visual resources, templates,
    or professional validation conditions that must be prepared in advance.
  evidence_requirements:
  - evidence_requirement_id: development-plan.evidence.1
    description: The plan covers all major delivery requirements in the requirements baseline, with no critical work 
      left without an accountable owner.
  - evidence_requirement_id: development-plan.evidence.2
    description: Critical dependencies, external inputs, and preconditions are identified; conditions not yet obtained 
      are not represented as available.
  - evidence_requirement_id: development-plan.evidence.3
    description: Relationships among staged outputs, responsibilities, and reviews are clear enough to judge when each 
      work item is complete.
  - evidence_requirement_id: development-plan.evidence.4
    description: Cross-professional work states the handoff recipient and required inputs rather than relying on 
      informal verbal agreement.

- deliverable_id: deliverable-design-spec
  activity_id: deliverable-design
  artifact_type: content-design-specification
  description: >-
    Deliverable design specification. Defines the information structure, major content units, reading or presentation order,
    information hierarchy, data and visual-expression principles, section/page relationships, and necessary formatting rules.
  evidence_requirements:
  - evidence_requirement_id: deliverable-design-spec.evidence.1
    description: Major content units map clearly to actual delivery requirements from the requirements baseline.
  - evidence_requirement_id: deliverable-design-spec.evidence.2
    description: Information hierarchy, reading path, and content relationships are clear, with no obvious omission, 
      duplication, or logical break.
  - evidence_requirement_id: deliverable-design-spec.evidence.3
    description: Requirements for data, visuals, graphics, or media are implementable rather than being expressed only 
      with vague words such as 'professional', 'premium', or 'concise'.
  - evidence_requirement_id: deliverable-design-spec.evidence.4
    description: The design does not sacrifice the appropriate expression of different content types merely to force 
      visual uniformity.

- deliverable_id: content-draft-package
  activity_id: content-development
  artifact_type: content-draft-package
  description: >-
    Complete content draft and source-material index, including body content, key conclusions, data and chart content, citations,
    visual-asset instructions, and necessary editorial information. The draft should already contain the complete substantive
    message and must not depend on the artifact-production stage to invent core facts or major arguments.
  evidence_requirements:
  - evidence_requirement_id: content-draft-package.evidence.1
    description: Major content requirements in the requirements baseline are realized at specific, locatable positions.
  - evidence_requirement_id: content-draft-package.evidence.2
    description: Key facts, figures, citations, and conclusions are traceable to their sources or calculation basis.
  - evidence_requirement_id: content-draft-package.evidence.3
    description: Terminology, time range, data definition, and conclusions are consistent across sections; any necessary
      differences are explicitly explained.
  - evidence_requirement_id: content-draft-package.evidence.4
    description: Unresolved, disputed, or unverifiable information is explicitly marked and not presented as established
      fact.
  - evidence_requirement_id: content-draft-package.evidence.5
    description: Compression, rewriting, and narrative organization do not remove important qualifications or risk 
      information.

- deliverable_id: production-package
  activity_id: artifact-production
  artifact_type: production-package
  description: >-
    Finished artifacts in the target medium, together with necessary editable sources, data files, graphic assets, and supporting
    files needed for reconstruction or modification. The exact file types and quantities are determined by the delivery requirements.
  evidence_requirements:
  - evidence_requirement_id: production-package.evidence.1
    description: The final artifact completely represents the approved content, without production-stage omission, 
      replacement, or alteration of critical facts and data.
  - evidence_requirement_id: production-package.evidence.2
    description: The relationship among editable sources, assets, and final artifacts is clear so that the result can be
      modified or regenerated when necessary.
  - evidence_requirement_id: production-package.evidence.3
    description: Formatting, charts, visual elements, and citations render correctly, with no obvious missing content, 
      misalignment, clipping, or version mixing.
  - evidence_requirement_id: production-package.evidence.4
    description: All files derive from the same valid content version, and obsolete drafts are not mixed into the formal
      artifact set.

- deliverable_id: validation-record
  activity_id: inspection-validation
  artifact_type: validation-record
  description: >-
    Inspection and validation record. Includes the inspected object and version, inspection basis, checks actually performed,
    issues found, corrections made, revalidation results, checks not performed, and remaining limitations.
  evidence_requirements:
  - evidence_requirement_id: validation-record.evidence.1
    description: The inspection scope covers the applicable aspects of requirement compliance, content correctness, 
      structural and cross-part consistency, communication quality, format integrity, and practical usability.
  - evidence_requirement_id: validation-record.evidence.2
    description: Every issue that could affect formal delivery has traceable evidence and a recorded correction or 
      disposition.
  - evidence_requirement_id: validation-record.evidence.3
    description: Affected content is revalidated after correction rather than merely marked as 'modified'.
  - evidence_requirement_id: validation-record.evidence.4
    description: Performed, unperformed, and impossible checks are clearly distinguished; unverified items are not 
      reported as passed.
  - evidence_requirement_id: validation-record.evidence.5
    description: Remaining limitations and non-blocking issues are preserved rather than removed simply because delivery
      is approaching.

- deliverable_id: release-package
  activity_id: release-delivery
  artifact_type: release-package
  description: >-
    Formal delivery package. Contains the final files, necessary editable sources and attachments, version information, usage
    guidance, and known limitations, preconditions, or unresolved items that the recipient needs to know.
  evidence_requirements:
  - evidence_requirement_id: release-package.evidence.1
    description: The delivery list corresponds item by item to the actual files, with clear names, versions, and 
      purposes.
  - evidence_requirement_id: release-package.evidence.2
    description: The final files are the definitive versions that completed inspection, correction, and revalidation.
  - evidence_requirement_id: release-package.evidence.3
    description: The formal delivery package contains no obsolete, duplicate, or easily misused candidate versions.
  - evidence_requirement_id: release-package.evidence.4
    description: The recipient can correctly use, view, or continue maintaining the result based on the existing files 
      and instructions.
  - evidence_requirement_id: release-package.evidence.5
    description: Known limitations and unresolved items are explicitly disclosed rather than omitted to create a false 
      appearance of complete success.

required_reviews:
- review_id: requirements-review
  deliverable_id: requirements-baseline
  description: >-
    Requirements baseline review. Confirms that the content-development objective, audience, usage scenario, delivery scope,
    and quality requirements are understood correctly; critical materials and constraints are recorded; and no major omission
    or unconfirmed assumption is likely to distort downstream work.
  reviewer_capabilities:
  - proposal-review
  independent_agent: true
  criteria:
  - process_criterion_id: requirements-review.criterion.1
    description: Objective, audience, usage scenario, and delivery scope are clearly expressed and mutually consistent.
  - process_criterion_id: requirements-review.criterion.2
    description: Explicit user requirements, input materials, and important constraints are covered and traceable.
  - process_criterion_id: requirements-review.criterion.3
    description: Scope boundaries are clear and content not requested by the user has not been silently converted into 
      mandatory delivery.
  - process_criterion_id: requirements-review.criterion.4
    description: Unresolved items are recorded rather than being replaced with unconfirmed assumptions.

- review_id: plan-review
  deliverable_id: development-plan
  description: >-
    Development-plan review. Confirms that the major work, professional responsibilities, dependent inputs, staged outputs,
    and review arrangements are complete and reasonable and can support orderly content design, production, and validation.
  reviewer_capabilities:
  - product-review
  independent_agent: true
  criteria:
  - process_criterion_id: plan-review.criterion.1
    description: Major work items cover all delivery requirements, and no critical responsibility is left unowned.
  - process_criterion_id: plan-review.criterion.2
    description: Dependencies, preconditions, and stage relationships are real and contain no obvious contradiction.
  - process_criterion_id: plan-review.criterion.3
    description: Work requiring research, data, visual design, production, or professional validation is identified in 
      advance.
  - process_criterion_id: plan-review.criterion.4
    description: The plan does not represent unavailable critical inputs or resources as already available.

- review_id: design-review
  deliverable_id: deliverable-design-spec
  description: >-
    Deliverable-design review. Confirms that the information structure and expression strategy can carry the full requirements,
    establish a clear information hierarchy and reading path, and provide sufficient implementable guidance for subsequent
    content production and artifact creation.
  reviewer_capabilities:
  - design-review
  independent_agent: true
  criteria:
  - process_criterion_id: design-review.criterion.1
    description: The information structure covers major requirements and forms a clear reading or presentation path.
  - process_criterion_id: design-review.criterion.2
    description: Major content units contain no obvious logical break, duplication, or unclear responsibility.
  - process_criterion_id: design-review.criterion.3
    description: Data, visual, and media rules are concrete and implementable.
  - process_criterion_id: design-review.criterion.4
    description: The design maintains overall consistency while allowing different content to use expression appropriate
      to its information characteristics.

- review_id: content-review
  deliverable_id: content-draft-package
  description: >-
    Content-quality review. Independently checks the complete content draft for requirement coverage, factual and numerical
    correctness, reasoning quality, source traceability, terminology and definition consistency, and preservation of important
    qualifications.
  reviewer_capabilities:
  - citation-analysis
  independent_agent: true
  criteria:
  - process_criterion_id: content-review.criterion.1
    description: Explicit requirements are realized in actual content; summaries, placeholders, or completion claims do 
      not replace missing sections.
  - process_criterion_id: content-review.criterion.2
    description: Key facts, figures, citations, and conclusions match approved sources and have locatable support.
  - process_criterion_id: content-review.criterion.3
    description: Terminology, data definitions, time ranges, and conclusions remain consistent across sections.
  - process_criterion_id: content-review.criterion.4
    description: The strength of important conclusions matches the evidence, and unknown, inferred, or disputed 
      information is not represented as established fact.
  - process_criterion_id: content-review.criterion.5
    description: The content is complete enough to enter artifact production without requiring the production stage to 
      invent core business content.

- review_id: production-review
  deliverable_id: production-package
  description: >-
    Artifact-quality review. Checks content completeness, formatting and visual presentation, file structure, version consistency,
    and practical usability in the final medium, and confirms that production did not change the meaning of approved content
    or introduce new delivery defects.
  reviewer_capabilities:
  - design-review
  independent_agent: true
  criteria:
  - process_criterion_id: production-review.criterion.1
    description: The final artifact is consistent with the approved content draft, and key facts, data, and citations 
      have not changed during production.
  - process_criterion_id: production-review.criterion.2
    description: The file opens and can be used normally; major layout, graphics, tables, images, and text contain no 
      obvious display defects.
  - process_criterion_id: production-review.criterion.3
    description: Formatting, terminology, and visual rules are reasonably consistent across pages, sections, or files.
  - process_criterion_id: production-review.criterion.4
    description: Editable sources and final artifacts correspond clearly, with no candidate version mixed into the 
      formal result.
  - process_criterion_id: production-review.criterion.5
    description: Medium- or usage-specific quality requirements have actually been checked.

- review_id: validation-review
  deliverable_id: validation-record
  description: >-
    Validation-result review. Confirms that the inspection scope matches delivery risk, discovered issues received real correction
    and revalidation, unperformed checks and known limitations are visible, and no unresolved issue still blocks formal delivery.
  reviewer_capabilities:
  - product-review
  independent_agent: true
  criteria:
  - process_criterion_id: validation-review.criterion.1
    description: Applicable critical quality dimensions have actually been checked and recorded.
  - process_criterion_id: validation-review.criterion.2
    description: Discovered issues, modifications, and revalidation results correspond one to one.
  - process_criterion_id: validation-review.criterion.3
    description: Unperformed or impossible checks are explicitly stated and not treated as passed.
  - process_criterion_id: validation-review.criterion.4
    description: No unresolved blocking defect remains that would directly affect formal delivery.
  - process_criterion_id: validation-review.criterion.5
    description: Non-blocking limitations and residual risks are preserved and prepared for disclosure with the 
      delivery.

- review_id: release-readiness-review
  deliverable_id: release-package
  description: >-
    Delivery-readiness review. Confirms that the formal delivery package is complete, version-consistent, usable, adequately
    documented, and identical to the definitive version that completed validation; only content satisfying delivery conditions
    may be provided as the formal result.
  reviewer_capabilities:
  - product-review
  independent_agent: true
  criteria:
  - process_criterion_id: release-readiness-review.criterion.1
    description: The delivery list, final files, editable sources, and attachments correspond completely with no version
      confusion.
  - process_criterion_id: release-readiness-review.criterion.2
    description: Formal files match the definitive version that completed inspection and revalidation.
  - process_criterion_id: release-readiness-review.criterion.3
    description: The recipient can correctly use or continue maintaining the result based on the available files and 
      necessary instructions.
  - process_criterion_id: release-readiness-review.criterion.4
    description: Known limitations, usage preconditions, and unresolved items are disclosed.
  - process_criterion_id: release-readiness-review.criterion.5
    description: No candidate, draft, or unvalidated version is being presented as the formal delivery.

workflow_rules:
- rule_id: requirement-traceability
  description: >-
    Maintain traceability of key requirements from the requirements baseline through content, final artifacts, and formal
    delivery. No stage may evade incomplete requirements by deleting or rephrasing them.
  enforced_by: review

- rule_id: source-integrity
  description: >-
    Facts, data, citations, and important conclusions must preserve their sources and definitions. Information that cannot
    be confirmed must be marked as unresolved, disputed, or unverified and must not be invented merely to make the content
    appear complete.
  enforced_by: review

- rule_id: version-consistency
  description: >-
    Content entering review and formal delivery must correspond to a definite version. After revision, affected content must
    be rechecked; approval of an older version cannot be reused automatically for new content.
  enforced_by: review

- rule_id: independent-quality-review
  description: >-
    Key reviews of requirements, content, final artifacts, and formal delivery must be performed by a role different from
    the primary producer, so producer self-checking does not replace independent quality judgment.
  enforced_by: review

- rule_id: release-completeness
  description: >-
    Formal delivery must confirm files, sources, instructions, versions, and known limitations as one complete delivery package.
    Completion of a single primary file alone must not be treated as completion of the overall delivery.
  enforced_by: review

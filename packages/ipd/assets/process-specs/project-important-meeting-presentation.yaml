schema_version: 2
process_spec_id: project-important-meeting-presentation-simple
version: 1.0.0
name: Important Meeting Presentation - Simple
description: >-
  A simplified PPT development process for important meetings, management presentations, project reviews, and formal proposal
  communication. The process follows five responsibilities: clarify the presentation objective, establish trustworthy content,
  design the storyline, produce the deck, and complete final validation. It focuses on content credibility, clear logic, strong
  emphasis, usable visual presentation, and ensuring that the definitive version is ready for formal meeting use.
source: >-
  Project-derived ProcessSpec for the important-meeting presentation scenario. It is based on common practices in formal content
  development, presentation production, and staged quality review. It is not an official current Huawei IPD template.
default_executable: true

applicable_when:
- The task requires a complete PPT for an important meeting, formal review, management communication, or decision 
  discussion.
- The presentation has material influence on understanding, judgment, decision-making, or project progress and should 
  not rely on one-shot generation alone.
- The presentation objective, audience, source materials, and delivery requirements are already clear or can be reliably
  clarified.

not_applicable_when:
- Only a temporary draft, simple formatting change, single-slide edit, or other low-risk presentation material is 
  required.
- The PPT is only an incidental record of another professional task rather than the primary deliverable.
- Key facts, presentation objectives, or usage context remain too unclear to support formal content design.

required_activities:
- activity_id: presentation-brief
  description: >-
    Clarify the meeting background, presentation purpose, target audience, intended understanding or decision, presentation
    duration, delivery format, main source materials, and key questions that must be addressed, creating a shared presentation
    brief.
  required_capabilities:
  - requirements-analysis

- activity_id: content-and-evidence
  description: >-
    Organize and verify the facts, data, sources, and key conclusions used in the presentation. Identify important messages,
    limitations, and unresolved items so that the main points are supported by reliable evidence.
  required_capabilities:
  - evidence-synthesis

- activity_id: storyline-design
  description: >-
    Design the presentation storyline, section relationships, and primary slide structure around the meeting objective. Define
    what each key slide must communicate, where major conclusions and action items belong, and ensure the whole presentation
    can be delivered clearly within the available time.
  required_capabilities:
  - narrative-design

- activity_id: deck-production
  description: >-
    Produce the complete PPT, including slide content, charts, images, visual styling, and layout. Preserve factual and numerical
    consistency throughout production, and use visual expression to reinforce information hierarchy and speaking priorities.
  required_capabilities:
  - artifact-production

- activity_id: final-validation
  description: >-
    Perform final validation of the definitive PPT version, covering content correctness, requirement coverage, narrative
    coherence, slide readability, visual consistency, key data, file integrity, and practical presentation usability. Correct
    discovered issues, revalidate affected content, and form the formal meeting version.
  required_capabilities:
  - artifact-review

required_deliverables:
- deliverable_id: presentation-brief
  activity_id: presentation-brief
  artifact_type: presentation-brief
  description: >-
    Presentation brief, including meeting objective, audience, usage context, duration, delivery requirements, questions that
    must be answered, main input materials, and unresolved items.
  evidence_requirements:
  - evidence_requirement_id: presentation-brief.evidence.1
    description: The meeting objective, audience, and key requirements are traceable to the user request or formal 
      source materials.
  - evidence_requirement_id: presentation-brief.evidence.2
    description: Unknowns that could materially change the presentation direction are explicitly recorded rather than 
      replaced with assumptions.

- deliverable_id: content-baseline
  activity_id: content-and-evidence
  artifact_type: presentation-content-baseline
  description: >-
    Verified key facts, data, sources, major conclusions, and limitations used as the presentation content baseline.
  evidence_requirements:
  - evidence_requirement_id: content-baseline.evidence.1
    description: Key facts, figures, and citations have traceable sources or reproducible derivations.
  - evidence_requirement_id: content-baseline.evidence.2
    description: Important conclusions are proportionate to the available evidence, and unknown or disputed information 
      is not presented as established fact.

- deliverable_id: presentation-storyboard
  activity_id: storyline-design
  artifact_type: presentation-storyboard
  description: >-
    Presentation storyline and slide structure, including section order, purpose of key slides, main conclusions, data placement,
    action items, and necessary appendix arrangements.
  evidence_requirements:
  - evidence_requirement_id: presentation-storyboard.evidence.1
    description: Major slides map clearly to the meeting objective and key requirements.
  - evidence_requirement_id: presentation-storyboard.evidence.2
    description: The storyline is coherent, and the slide count and information density are broadly appropriate for the 
      presentation duration.

- deliverable_id: presentation-deck
  activity_id: deck-production
  artifact_type: presentation-deck
  description: >-
    Complete editable PPT deck and necessary supporting assets or auxiliary files.
  evidence_requirements:
  - evidence_requirement_id: presentation-deck.evidence.1
    description: PPT content is consistent with the approved facts, data, and storyboard.
  - evidence_requirement_id: presentation-deck.evidence.2
    description: The file opens and presents correctly, without obvious misalignment, overlap, clipping, font, or media 
      problems.
  - evidence_requirement_id: presentation-deck.evidence.3
    description: Slide hierarchy, charts, colors, typography, and layout are reasonably consistent and support 
      information communication.

- deliverable_id: final-presentation-package
  activity_id: final-validation
  artifact_type: presentation-release-package
  description: >-
    Formal meeting version after final inspection and revalidation, including the final PPT and any actually required notes,
    appendices, citations, or version information.
  evidence_requirements:
  - evidence_requirement_id: final-presentation-package.evidence.1
    description: The final file is the definitive version that completed inspection and revalidation.
  - evidence_requirement_id: final-presentation-package.evidence.2
    description: Known issues and limitations are resolved or explicitly disclosed, and no known blocking problem 
      remains that would directly affect meeting use.
  - evidence_requirement_id: final-presentation-package.evidence.3
    description: The formal version can be used directly for the intended meeting and is not confused with obsolete or 
      candidate versions.

required_reviews:
- review_id: brief-and-content-review
  deliverable_id: content-baseline
  description: >-
    Presentation content baseline review. Confirms that the presentation objective is understood correctly and that key facts,
    data, sources, and main conclusions are reliable, with no major omission or unsupported judgment likely to send the subsequent
    PPT in the wrong direction.
  reviewer_capabilities:
  - evidence-review
  independent_agent: true
  criteria:
  - process_criterion_id: brief-and-content-review.criterion.1
    description: Key facts, figures, and citations have reliable and traceable support.
  - process_criterion_id: brief-and-content-review.criterion.2
    description: Core presentation messages align with the meeting objective and audience concerns.
  - process_criterion_id: brief-and-content-review.criterion.3
    description: Unconfirmed items and important limitations remain explicit rather than being presented as established 
      facts.

- review_id: storyline-review
  deliverable_id: presentation-storyboard
  description: >-
    Presentation structure review. Confirms that the storyline is clear, priorities are appropriate, key slides carry explicit
    information responsibilities, and the presentation can form a complete and persuasive narrative within the scheduled meeting
    time.
  reviewer_capabilities:
  - proposal-review
  independent_agent: true
  criteria:
  - process_criterion_id: storyline-review.criterion.1
    description: The overall structure is organized around the meeting objective rather than simply following the order 
      of source materials.
  - process_criterion_id: storyline-review.criterion.2
    description: Key conclusions, evidence, and action items are logically connected.
  - process_criterion_id: storyline-review.criterion.3
    description: Slide count and information density are appropriate to the presentation duration and emphasis 
      allocation.

- review_id: final-deck-review
  deliverable_id: final-presentation-package
  description: >-
    Final PPT comprehensive review. Confirms that content, data, visual presentation, file integrity, and actual speaking
    conditions meet formal meeting-use requirements.
  reviewer_capabilities:
  - artifact-review
  independent_agent: true
  criteria:
  - process_criterion_id: final-deck-review.criterion.1
    description: The final PPT is complete and its key facts, figures, and conclusions are accurate.
  - process_criterion_id: final-deck-review.criterion.2
    description: Visual hierarchy, charts, and layout are clear, with no obvious defect that materially harms 
      understanding or presentation.
  - process_criterion_id: final-deck-review.criterion.3
    description: The file opens and presents correctly, and the formal version is unique and clearly identifiable.
  - process_criterion_id: final-deck-review.criterion.4
    description: No known blocking issue remains that would directly affect use in the important meeting.

workflow_rules:
- rule_id: meeting-purpose-first
  description: >-
    Presentation content and slide structure must primarily serve the meeting objective and audience needs. Existing materials
    must not be stacked into slides simply because they are available.
  enforced_by: review

- rule_id: evidence-integrity
  description: >-
    Key facts, figures, charts, and conclusions must preserve consistent sources and definitions. Unconfirmed information
    must not be fabricated or exaggerated to strengthen persuasion.
  enforced_by: review

- rule_id: storyline-before-production
  description: >-
    Formal PPT production should begin from a reasonably stable storyline and content baseline. The production stage must
    not become the stage where core conclusions are redefined or critical facts are invented at the last minute.
  enforced_by: review

- rule_id: independent-final-review
  description: >-
    The final PPT for an important meeting must receive an independent comprehensive review by a professional role different
    from the primary producer; producer self-checking cannot replace the final quality judgment.
  enforced_by: review

- rule_id: version-consistency
  description: >-
    PPTs entering review and formal meeting use must correspond to an explicit version. After key content or data changes,
    affected slides and conclusions must be rechecked.
  enforced_by: review

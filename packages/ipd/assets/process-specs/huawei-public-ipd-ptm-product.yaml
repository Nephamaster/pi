workflow_rules:
- rule_id: R-FULL-SOURCE-SCOPE
  description: Preserve all mandatory activities; physical verification in the public source must not be replaced merely
    by renaming another activity. Workflow design must cover each required activity, deliverable, and review.
  enforced_by: review
- rule_id: R-FULL-HANDOFF
  description: Handoffs include exact versions, upstream approval basis, evidence indexes, and gaps. The Workflow design
    must express actual input and approval bindings rather than relying on directory guesses.
  enforced_by: review
- rule_id: R-FULL-NO-AUTHORITY
  description: Technical evaluation is separate from enterprise DCP/GA authority. Without a real authorization channel, 
    the process must not claim that a product has been shipped, released, or approved for investment.
  enforced_by: review
- rule_id: R-FULL-REWORK
  description: Quality rework is a normal closed loop that preserves the original Session and frozen standards. 
    Downstream artifacts affected by invalidated inputs must obtain valid approval again.
  enforced_by: review

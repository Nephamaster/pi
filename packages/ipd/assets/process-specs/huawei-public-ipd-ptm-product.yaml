required_reviews:
- review_id: G-P01
  deliverable_id: D-P01
  description: Project-added independent quality review; this is not claimed to be a Gate named in the Huawei source. A 
    non-producer with `domain-test-review` capability reviews the quality of D-P01; this does not automatically approve 
    product release.
  reviewer_capabilities:
  - domain-test-review
  independent_agent: true
  criteria:
  - process_criterion_id: G-P01.criterion.1
    description: Every test requirement has a source and is verifiable; items that cannot be verified state the reason.
  - process_criterion_id: G-P01.criterion.2
    description: Functional and quality-attribute coverage is complete, with no unauthorized business assumption added.
  - process_criterion_id: G-P01.criterion.3
    description: Material versions, scope, and evidence are verifiable. Missing necessary facts are truthfully blocked 
      or recorded as unverified rather than fabricated.

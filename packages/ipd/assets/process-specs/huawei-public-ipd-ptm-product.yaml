# Engineering mapping of a public process; not an official Huawei internal template.
# Includes product/hardware verification capabilities not yet covered by the current employee pool; do not activate without matching resources.
schema_version: 2
process_spec_id: huawei-public-ipd-ptm-product
version: 2.0.0
name: 'Public IPD-PTM Product Test Management: Full-Scope Semantic Mapping'
description: |-
  "Full scope" refers only to the set of activities and verification types contained in the five public source pages; it does not represent a complete internal PTM manual.
  Specification nature: engineering mapping based on the public IPD-PTM practices H1-H5, not a Huawei-internal issued template. It preserves sixteen activity types and the intended meanings of SDV/SIT/SVT and physical reliability. Detailed operating steps, artifact formats, independent Gates, and machine bindings are project translations.
  Organization: the Test Manager organizes the testing discipline; Test Analysts derive testable requirements; Test Engineers design and execute tests; Automation Test Engineers own tools, scripts, and debugging. Real-world PDT authority is not automatically granted to any Agent. Appropriate product/hardware reliability expertise is required rather than substituting an API Tester for all test roles.
  Design sequence: overall requirements P01 support P02; P02 supports P03/P04; P04 supports P05; P02/P05 support P06. P05/P07 support tools, cases, and script implementation, and P11 debugging can begin once interface conditions are met. Real results from P12/P13 converge through P14 into P15/P16. Concrete data dependencies must be expressed by the Workflow design; this text is not an implicit route that the engine automatically parses.
  Phase relationship: test design starts early, and feature-level implementation and debugging can proceed during development; execution activities may run in parallel once the tested object, environment, and strategy are ready. Pre-release quality convergence does not imply that all preceding work must be serialized.
  Workflow requirements: each execution/review node has one professional employee; each controlled artifact binds an exact version; release is governed by the RequiredReviews below; rework returns to the original Session. The professional opinion in P16 is distinct from a Runtime Gate decision, and approval of a report artifact must never be misrepresented as product release authorization.
  Adaptation limitation: the current 42 Agency cards do not cover the full-scope physical product testing, reliability, and manufacturing-verification capabilities required here. If the necessary employees, tools, or data are unavailable, this specification must not be started and claimed as successfully executed. Select the separately published software-derived specification instead of asking ST to delete P13 or rename SVT.
source: |-
  Huawei Cloud CodeArts TestPlan official IPD testing process and practice, H1-H5. URLs follow. The source activities are public-source facts; refined contracts and Gates are project translations.
  H1 https://support.huaweicloud.com/usermanual-testman/cloudtest_01_1502.html
  H2 https://support.huaweicloud.com/usermanual-testman/cloudtest_01_1503.html
  H3 https://support.huaweicloud.com/usermanual-testman/cloudtest_01_1504.html
  H4 https://support.huaweicloud.com/usermanual-testman/cloudtest_01_1505.html
  H5 https://support.huaweicloud.com/usermanual-testman/cloudtest_01_1506.html
default_executable: false
applicable_when:
- The task is product test management that includes prototype verification, system integration, manufacturing 
  verification, and physical reliability requirements.
- Exact requirement/specification versions, product or test data, an authorized environment, and employees/tools with 
  the corresponding product-testing capabilities can be provided.
- The user needs product-testing and quality-evaluation materials; completion of this task must not be interpreted as 
  real-world enterprise investment approval or release authorization.
not_applicable_when:
- The task is software-only and cannot provide formal production-line hardware or physical-reliability test conditions.
- The task expects ST to delete, merge, or modify mandatory activities of this ProcessSpec within the Run.
- No real testing channel is available and simulated results would be used to claim completion of physical-product 
  verification.
required_activities:
- activity_id: P01
  description: |-
    Test requirement analysis. Source: H2; original responsibility: Test Manager organizes analysts.
    Project refinement: verify the version, scope, and provenance of product and design materials; convert functional, non-functional, boundary, and constraint requirements into inspectable items; preserve requirement-to-test-requirement traceability. Unknown specifications remain explicit and are not invented by the analyst.
    Input responsibility: confirm and reference the effective materials and approved upstream versions for this run. Deliverable: D-P01. Do not schedule downstream work or change standards.
  required_capabilities:
  - product-test-analysis
- activity_id: P02
  description: |-
    Overall product test strategy. Source: H2; original responsibility: Test Manager.
    Project refinement: define verification levels, risk priorities, test types, automation, environments, data, and professional division of work; use one overall strategy to constrain subsequent feature-level and phase-level plans.
    Input responsibility: confirm and reference the effective materials and approved upstream versions for this run. Deliverable: D-P02. Do not schedule downstream work or change standards.
  required_capabilities:
  - product-test-strategy
- activity_id: P03
  description: |-
    Test and verification planning. Source: H2; original responsibility: Test Manager organizes Test Engineers.
    Project refinement: translate the overall strategy into a WBS with deliverables, responsibilities, and dependencies. Estimates must come from task input or explicit analysis and must not be converted into Runtime budget limits.
    Input responsibility: confirm and reference the effective materials and approved upstream versions for this run. Deliverable: D-P03. Do not schedule downstream work or change standards.
  required_capabilities:
  - product-test-planning
- activity_id: P04
  description: |-
    Feature test requirement analysis. Source: H2; original responsibility: Test Manager and assigned team.
    Project refinement: analyze normal, boundary, abnormal, and interaction behavior for the assigned feature; refine from the overall requirements without changing the original acceptance meaning.
    Input responsibility: confirm and reference the effective materials and approved upstream versions for this run. Deliverable: D-P04. Do not schedule downstream work or change standards.
  required_capabilities:
  - feature-test-analysis
- activity_id: P05
  description: |-
    Feature test solution design. Source: H2; original responsibility: Test Manager organizes team members.
    Project refinement: define the test method, observable measurements, data, environment, and pass/fail interpretation for each verification point; where physical equipment is needed, state qualification and availability explicitly.
    Input responsibility: confirm and reference the effective materials and approved upstream versions for this run. Deliverable: D-P05. Do not schedule downstream work or change standards.
  required_capabilities:
  - feature-test-design
- activity_id: P06
  description: |-
    SDV/SIT/SVT test-strategy design. Source: H2; original responsibility: Test Manager organizes the team.
    Project refinement: derive practical phase strategies from the overall and feature solutions; define the object, environment, case set, and evidence convergence for each phase. SVT requires formal production-line hardware, so software-only tasks do not qualify for this full-scope version.
    Input responsibility: confirm and reference the effective materials and approved upstream versions for this run. Deliverable: D-P06. Do not schedule downstream work or change standards.
  required_capabilities:
  - product-verification-strategy
- activity_id: P07
  description: |-
    Test automation analysis. Source: H3; original responsibility: Automation Test Engineer.
    Project refinement: analyze repeatability, interface stability, data availability, observability, and maintenance cost; choose what to automate, what tools to reuse or adapt, and what should remain manual.
    Input responsibility: confirm and reference the effective materials and approved upstream versions for this run. Deliverable: D-P07. Do not schedule downstream work or change standards.
  required_capabilities:
  - test-automation-feasibility
- activity_id: P08
  description: |-
    Automation test tool development/adaptation. Source: H3; original responsibility: Automation Test Engineer.
    Project refinement: reuse, adapt, or develop the necessary tools; validate input handling, execution, result collection, errors, permissions, and rerun behavior. If no modification is needed, deliver adaptation verification for the existing tool rather than inventing development work.
    Input responsibility: confirm and reference the effective materials and approved upstream versions for this run. Deliverable: D-P08. Do not schedule downstream work or change standards.
  required_capabilities:
  - test-automation-tooling
- activity_id: P09
  description: |-
    Test case implementation. Source: H3; original responsibility: Test Manager organizes team members.
    Project refinement: convert feature and specialized test solutions into deterministic test cases, with prerequisites, steps, inputs, expected results, cleanup, and decision basis.
    Input responsibility: confirm and reference the effective materials and approved upstream versions for this run. Deliverable: D-P09. Do not schedule downstream work or change standards.
  required_capabilities:
  - product-test-case-design
- activity_id: P10
  description: |-
    Test script/code/data preparation. Source: H3; original responsibility: Test Manager organizes the team.
    Project refinement: prepare scripts, test code, device control, or test data; protect original inputs and address isolation, repeatability, and secret handling.
    Input responsibility: confirm and reference the effective materials and approved upstream versions for this run. Deliverable: D-P10. Do not schedule downstream work or change standards.
  required_capabilities:
  - test-automation-implementation
- activity_id: P11
  description: |-
    Automated-case debugging. Source: H3; original responsibility: Automation Test Engineer and Test Engineer collaborate.
    Project refinement: once a version meets debugging prerequisites, verify scripts, tools, and the interface under test as early as possible; record tool errors, test-case errors, and product problems separately, and never change expected behavior merely to make debugging appear green.
    Input responsibility: confirm and reference the effective materials and approved upstream versions for this run. Deliverable: D-P11. Do not schedule downstream work or change standards.
  required_capabilities:
  - test-automation-debugging
- activity_id: P12
  description: |-
    Test execution. Source: H4; original responsibility: Test Engineer.
    Project refinement: execute phase test cases against the approved version, environment, and strategy, recording observations and defects. Formal SVT verification requires a real measurement channel using the matching product and equipment.
    Input responsibility: confirm and reference the effective materials and approved upstream versions for this run. Deliverable: D-P12. Do not schedule downstream work or change standards.
  required_capabilities:
  - product-system-testing
- activity_id: P13
  description: |-
    Reliability testing. Source: H4; the cited row does not name a separate original role.
    Project refinement: execute and analyze reliability tests against product-design, process, and material requirements using authorized equipment and an approved plan; record samples, conditions, calibration, methods, and measurements.
    Input responsibility: confirm and reference the effective materials and approved upstream versions for this run. Deliverable: D-P13. Do not schedule downstream work or change standards.
  required_capabilities:
  - physical-reliability-testing
- activity_id: P14
  description: |-
    Defect analysis. Source: H4; original responsibility: Test Manager organizes Test Engineers.
    Project refinement: consolidate defects and distinguish symptoms, evidenced root causes, impact, and duplicate relationships; record fix versions and retest needs. The analyst must not automatically modify the product or close defects.
    Input responsibility: confirm and reference the effective materials and approved upstream versions for this run. Deliverable: D-P14. Do not schedule downstream work or change standards.
  required_capabilities:
  - product-defect-analysis
- activity_id: P15
  description: |-
    Test report preparation. Source: H5; original responsibility: Test Manager.
    Project refinement: summarize measurements and defects with primary emphasis on the quality of the product under test; do not mix a process summary with proof of product qualification. Lock the version and scope to which the report applies.
    Input responsibility: confirm and reference the effective materials and approved upstream versions for this run. Deliverable: D-P15. Do not schedule downstream work or change standards.
  required_capabilities:
  - product-quality-reporting
- activity_id: P16
  description: |-
    Test evaluation. Source: H5; original responsibility: Test Manager organizes team members.
    Project refinement: evaluate how well release requirements are satisfied based on measurements and defects and summarize subsequent process-improvement opportunities. The public source table does not define a formal output format; this project adds a structured evaluation and a separate process-review record.
    Input responsibility: confirm and reference the effective materials and approved upstream versions for this run. Deliverable: D-P16. Do not schedule downstream work or change standards.
  required_capabilities:
  - product-test-evaluation

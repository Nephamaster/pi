workflow_rules:
- rule_id: R-FULL-SOURCE-SCOPE
  description: 保留全部必需活动；公开资料中的物理验证不得通过改名替换。Workflow 设计阶段按 required_activities/deliverables/reviews 逐项覆盖。
  enforced_by: review
- rule_id: R-FULL-HANDOFF
  description: 交接包含确切版本、上游准出依据、证据索引和缺口。设计师显式填写输入与审批绑定，不能依赖目录猜测。
  enforced_by: review
- rule_id: R-FULL-NO-AUTHORITY
  description: 技术评价与企业 DCP/GA 权限分开。没有真实授权渠道不能声称已发货、发布或批准投资。
  enforced_by: review
- rule_id: R-FULL-REWORK
  description: 质量返工是正常闭环，维持原 Session 和固定标准；对失效输入的下游产物必须重新取得有效准出。
  enforced_by: review

schema_version: 2
process_spec_id: project-minimal-general-delivery
version: 2.0.0
name: Minimal General Delivery
description: >-
  A minimal general-purpose process for ordinary multi-step delivery tasks. It starts by clarifying the task objective and
  delivery boundary, then proceeds through execution planning, professional work and result integration, independent quality
  review, and formal delivery. The process ensures that task requirements have accountable owners, key inputs have traceable
  sources, final results can be independently checked, and discovered issues can be reworked and revalidated. This specification
  defines only the minimum responsibilities and quality loop required for a controlled delivery. It does not prescribe a specific
  industry, medium, technical approach, or number of professional roles. When a more appropriate domain-specific ProcessSpec
  exists, that specialized specification should be preferred.
source: >-
  Project-defined default minimal ProcessSpec for general formal delivery tasks not covered by a more specific process. Its
  activities, deliverables, capability requirements, and review requirements are project-defined general process design, not
  an official Huawei internal IPD template.
default_executable: true

applicable_when:
- The task has a clear or clarifiable objective and must produce an actual deliverable that can be independently 
  inspected.
- The task contains multiple related work steps, and attempting to complete it in one undifferentiated pass would create
  meaningful risk of requirement loss, version confusion, or quality defects.
- The main delivery requirements and basic acceptance basis can be established before formal execution, and the 
  completed result can undergo independent inspection.
- No more appropriate domain-, risk-, or delivery-specific ProcessSpec is currently available for this task.

not_applicable_when:
- The task only requires an immediate answer, simple explanation, one-off rewrite, lightweight information lookup, or 
  another low-overhead activity that does not need formal delivery governance.
- A mandatory professional, compliance, safety, experimental, manufacturing, or release process applies and this 
  specification cannot cover its required controls.
- The core objective, delivery object, or success conditions remain fundamentally inconsistent, so a stable work 
  baseline cannot yet be formed.
- The key result cannot be independently checked or verified and would rely only on the producer's self-declaration of 
  completion.

required_activities:
- activity_id: task-definition
  description: >-
    Task definition. Clarify the objective, delivery target, intended use, scope, available materials, key constraints, major
    quality requirements, and completion conditions, while identifying missing, conflicting, or unresolved information. This
    responsibility is typically owned by project planning, requirement analysis, or coordination roles, with domain specialists
    contributing factual boundaries when needed. Task definition establishes the work baseline and must not assume that unavailable
    information is already known.
  required_capabilities:
  - project-planning

- activity_id: execution-planning
  description: >-
    Execution planning and work arrangement. Translate the task baseline into major work items, professional responsibilities,
    inputs and outputs, critical dependencies, parallel opportunities, convergence method, quality checks, and delivery order.
    The plan should be concrete enough that participants understand what they own, which inputs they require, and what they
    must produce, while avoiding work and deliverables unrelated to the task objective. This responsibility is typically owned
    by project coordination, solution planning, or another role capable of organizing the whole effort.
  required_capabilities:
  - project-planning

- activity_id: work-execution
  description: >-
    Professional execution and result integration. Responsible specialists perform the actual work against the approved task
    baseline and execution plan, producing the agreed outputs and necessary evidence. Research, analysis, design, implementation,
    production, and other professional work may proceed in parallel when appropriate, with integration resolving interface,
    version, terminology, and content consistency. Difficulty must not be hidden by omitting requirements, changing facts,
    or lowering agreed quality conditions.
  required_capabilities:
  - artifact-production

- activity_id: final-delivery
  description: >-
    Final preparation and delivery. Organize the results that have completed quality review and required rework into a definitive
    version with necessary attachments, source references, version information, and usage or maintenance guidance. Remove
    obsolete or easily confused candidate versions and clearly disclose remaining limitations, preconditions, and unresolved
    items. The delivered package must match the approved result version and allow the recipient to identify, use, or continue
    working with the formal result correctly.
  required_capabilities:
  - artifact-production

required_deliverables:
- deliverable_id: task-baseline
  activity_id: task-definition
  artifact_type: task-baseline
  description: >-
    Task baseline. Records the objective, delivery target, intended use, scope, input materials, key constraints, major quality
    requirements, completion conditions, and unresolved items.
  evidence_requirements:
  - evidence_requirement_id: task-baseline.evidence.1
    description: Each key objective and requirement is traceable to the user request, formal material, or another 
      explicit source.
  - evidence_requirement_id: task-baseline.evidence.2
    description: The in-scope and out-of-scope boundaries are clear and do not depend on hidden assumptions to keep the 
      task valid.
  - evidence_requirement_id: task-baseline.evidence.3
    description: Missing, conflicting, and unresolved information is recorded explicitly, together with its impact on 
      downstream work.
  - evidence_requirement_id: task-baseline.evidence.4
    description: Completion conditions can be used to judge whether the final result satisfies this task, rather than 
      relying on a generic statement that the work was completed.

- deliverable_id: execution-plan
  activity_id: execution-planning
  artifact_type: execution-plan
  description: >-
    Execution plan. Describes the major work items, professional responsibilities, necessary inputs, expected outputs, dependencies
    and parallel relationships, convergence method, quality-check arrangement, and delivery order.
  evidence_requirements:
  - evidence_requirement_id: execution-plan.evidence.1
    description: Every major requirement in the task baseline has an accountable owner and an expected result; no 
      critical work is left without responsibility.
  - evidence_requirement_id: execution-plan.evidence.2
    description: Critical inputs, dependencies, and preconditions either actually exist or are explicitly marked as 
      still to be obtained; unknown conditions are not represented as satisfied.
  - evidence_requirement_id: execution-plan.evidence.3
    description: Work that can proceed independently is arranged for appropriate parallel execution, and outputs that 
      must converge have explicit consistency and handoff requirements.
  - evidence_requirement_id: execution-plan.evidence.4
    description: Quality-check targets and their basic acceptance basis are defined before execution rather than 
      invented only after the result is produced.

- deliverable_id: candidate-result
  activity_id: work-execution
  artifact_type: candidate-result
  description: >-
    Candidate result package. Contains the actual result required by the task, necessary intermediate results, source or input
    indexes, validation evidence, and the guidance required to use the result. The concrete form may be files, data, code,
    reports, designs, or other deliverables defined by the task.
  evidence_requirements:
  - evidence_requirement_id: candidate-result.evidence.1
    description: All major delivery requirements in the task baseline are realized in concrete results or have an 
      explicit explanation of why they could not be completed.
  - evidence_requirement_id: candidate-result.evidence.2
    description: Key facts, data, calculations, citations, tests, and other verifiable claims have corresponding sources
      and evidence.
  - evidence_requirement_id: candidate-result.evidence.3
    description: Multi-part results are consistent in version, terminology, data definition, interfaces, and 
      cross-references, without material conflicts or omissions.
  - evidence_requirement_id: candidate-result.evidence.4
    description: Known limitations, incomplete items, and unverifiable aspects remain explicitly disclosed rather than 
      being presented as completed or passed.
  - evidence_requirement_id: candidate-result.evidence.5
    description: The result can be independently read, run, inspected, or used; it is not merely a completion statement.

- deliverable_id: delivery-package
  activity_id: final-delivery
  artifact_type: delivery-package
  description: >-
    Formal delivery package. Contains the final result after required corrections, together with necessary attachments and
    sources, version information, usage or maintenance guidance, and limitations or unresolved items the recipient must know.
  evidence_requirements:
  - evidence_requirement_id: delivery-package.evidence.1
    description: The formal delivery matches the definitive version that completed quality review and does not include 
      obsolete or unchecked candidate results.
  - evidence_requirement_id: delivery-package.evidence.2
    description: Files, data, attachments, and instructions correspond item by item, with clear names, versions, and 
      intended uses.
  - evidence_requirement_id: delivery-package.evidence.3
    description: Known limitations, applicability conditions, and unresolved items are explicitly disclosed rather than 
      omitted to create a false impression of complete success.
  - evidence_requirement_id: delivery-package.evidence.4
    description: The recipient can use, inspect, or continue processing the delivered result based on the available 
      artifacts and guidance.

required_reviews:
- review_id: plan-readiness-review
  deliverable_id: execution-plan
  description: >-
    Execution readiness review. Confirms that the task has been understood correctly, major responsibilities, deliverables,
    dependencies, and quality checks are complete, and no major gap or unconfirmed critical assumption is likely to send subsequent
    work in the wrong direction.
  reviewer_capabilities:
  - artifact-review
  independent_agent: true
  criteria:
  - process_criterion_id: plan-readiness-review.criterion.1
    description: The execution plan is consistent with the task baseline, and major objectives and explicit requirements
      have not been omitted or altered during planning.
  - process_criterion_id: plan-readiness-review.criterion.2
    description: The relationships among major work items, responsibilities, inputs, and outputs are clear enough for 
      downstream specialists to execute.
  - process_criterion_id: plan-readiness-review.criterion.3
    description: Critical dependencies and unresolved conditions are identified; important information that has not yet 
      been obtained is not treated as available.
  - process_criterion_id: plan-readiness-review.criterion.4
    description: Quality-check targets and the basic acceptance basis are defined and appropriate to the actual task 
      risks.
  - process_criterion_id: plan-readiness-review.criterion.5
    description: The plan does not introduce clearly irrelevant work, deliverables, or process overhead.

- review_id: result-quality-review
  deliverable_id: candidate-result
  description: >-
    Result quality review. A reviewer who did not produce the result independently checks the actual deliverable against the
    task baseline and frozen quality requirements, judging requirement coverage, correctness, consistency, evidence sufficiency,
    and practical usability. Any defect must be tied to the required correction and revalidation condition.
  reviewer_capabilities:
  - artifact-review
  independent_agent: true
  criteria:
  - process_criterion_id: result-quality-review.criterion.1
    description: Major task requirements are realized in the actual result; summaries, placeholders, or completion 
      claims do not substitute for missing deliverables.
  - process_criterion_id: result-quality-review.criterion.2
    description: Key facts, data, calculations, citations, tests, and other important conclusions are consistent with 
      and traceable to the available evidence.
  - process_criterion_id: result-quality-review.criterion.3
    description: Multi-part results contain no material version, interface, terminology, data-definition, or logical 
      conflicts that would affect use.
  - process_criterion_id: result-quality-review.criterion.4
    description: The result can actually be read, run, understood, or used in the target scenario and satisfies the 
      explicit quality requirements of the task.
  - process_criterion_id: result-quality-review.criterion.5
    description: Unverified, unknown, and limited aspects are explicitly disclosed rather than incorrectly represented 
      as passed.

- review_id: delivery-readiness-review
  deliverable_id: delivery-package
  description: >-
    Delivery readiness review. Confirms that the formal delivery package matches the result that completed quality review,
    has clear versioning, complete files, and sufficient instructions, and contains no ambiguity that could cause recipients
    to misuse a candidate or obsolete version.
  reviewer_capabilities:
  - artifact-review
  independent_agent: true
  criteria:
  - process_criterion_id: delivery-readiness-review.criterion.1
    description: The formal package contains only the definitive version and its required attachments, with no unchecked
      candidate version mixed in.
  - process_criterion_id: delivery-readiness-review.criterion.2
    description: The delivery list, actual files, versions, and purposes are consistent, allowing the recipient to 
      identify the formal result unambiguously.
  - process_criterion_id: delivery-readiness-review.criterion.3
    description: Necessary usage, viewing, execution, or maintenance instructions are provided and match the actual 
      result.
  - process_criterion_id: delivery-readiness-review.criterion.4
    description: Known limitations, applicability conditions, and unresolved items are disclosed with the delivery.
  - process_criterion_id: delivery-readiness-review.criterion.5
    description: No known issue remains that would directly prevent the intended use.

workflow_rules:
- rule_id: requirement-traceability
  description: >-
    Maintain continuous traceability of major requirements from task definition through formal delivery. Any deletion, replacement,
    or weakening of an important requirement must have explicit justification and must not disappear silently in later work.
  enforced_by: review

- rule_id: independent-quality-review
  description: >-
    The primary result intended for delivery must undergo independent quality review. Producer self-checking may serve as
    evidence but cannot replace independent review.
  enforced_by: review

- rule_id: controlled-rework
  description: >-
    Issues found during review must return to the actual responsible party for correction, followed by reinspection of the
    affected content. Results that remain valid and are not affected by local rework should not be rejected indiscriminately.
  enforced_by: review

- rule_id: version-consistency
  description: >-
    Review and formal delivery must target explicit result versions. After revision creates a new version, approval of the
    older version does not automatically apply to the new content.
  enforced_by: review

schema_version: 2
process_spec_id: project-minimal-general-delivery
version: 2.0.0
name: Minimal General Delivery
description: >-
  面向一般性多步骤交付任务的最小通用流程。流程以明确任务目标和交付边界为起点，
  经过执行方案确认、专业工作与成果集成、独立质量检查和正式交付，保证任务要求有人承担、
  关键输入有来源、最终成果可检查、发现的问题能够返工并重新验证。
  本规范只规定完成一次受控交付所必需的最小责任和质量闭环，不限定具体行业、媒介、技术路线或专业分工数量；
  当存在更适合的专业流程规范时，应优先采用专业规范。
source: >-
  项目自定义的默认最小流程规范，用于尚无更具体流程模板覆盖的一般性正式交付任务。
  其阶段、交付物、角色能力和评审要求为项目侧通用流程设计，不是华为内部正式 IPD 模板。
default_executable: true

applicable_when:
  - 任务具有明确或可明确化的目标，并需要形成可交付、可检查的实际成果。
  - 任务包含多个相互关联的工作步骤，直接一次性完成容易产生需求遗漏、版本混乱或质量缺陷。
  - 能够在正式执行前确定主要交付要求和基本验收依据，并在成果形成后进行独立检查。
  - 当前没有更适合该任务领域、风险或交付类型的专用流程规范。

not_applicable_when:
  - 仅需要即时问答、简单解释、单次改写、轻量信息查询或其他无需正式交付管理的任务。
  - 存在必须遵循的专业、合规、安全、实验、制造或发布流程，而本规范无法覆盖其强制要求。
  - 任务的核心目标、交付对象或成功条件仍存在根本冲突，无法形成稳定的工作基线。
  - 关键成果无法被检查或验证，只能依赖执行者自我声明完成。

required_activities:
  - activity_id: task-definition
    description: >-
      任务定义。明确目标、交付对象、使用目的、工作范围、已有材料、关键约束、主要质量要求和完成条件，
      同时识别缺失、冲突或尚待确认的重要信息。通常由任务负责人、需求分析或项目协调类角色承担；
      必要时吸收领域专业人员确认事实和边界。任务定义只建立工作基线，不预先假定尚未获得的信息已经成立。
    required_capabilities:
      - project-planning

  - activity_id: execution-planning
    description: >-
      执行方案与工作安排。根据任务基线确定主要工作项、专业责任、输入与输出、关键依赖、并行关系、
      汇总方式、质量检查和交付顺序。方案应足以让参与人员理解自己负责什么、需要什么输入以及形成什么成果，
      同时避免增加与目标无关的流程和交付。通常由项目协调、方案设计或具备整体组织能力的角色承担。
    required_capabilities:
      - project-planning

  - activity_id: work-execution
    description: >-
      专业执行与成果集成。各责任人员依据已确认的任务基线和执行方案完成实际专业工作，形成约定成果及必要证据；
      可以按照任务特性并行开展研究、分析、设计、实现、制作或其他专业活动，并在汇总时处理接口、版本和内容一致性。
      执行过程中不得通过省略要求、改变事实或降低既定质量条件来消除困难。
    required_capabilities:
      - artifact-production

  - activity_id: final-delivery
    description: >-
      最终整理与交付。针对已经完成质量检查和必要返工的成果，整理确定版本、必要附件、来源或使用说明，
      清理容易造成混淆的候选版本，并明确仍存在的限制、使用前提和未解决事项。交付内容应与已确认的成果版本一致，
      使接收方能够识别正式结果并正确使用或继续处理。
    required_capabilities:
      - artifact-production

required_deliverables:
  - deliverable_id: task-baseline
    activity_id: task-definition
    artifact_type: task-baseline
    description: >-
      任务基线。记录目标、交付对象、使用目的、范围、输入材料、关键约束、主要质量要求、完成条件以及待确认事项。
    evidence_requirements:
      - evidence_requirement_id: task-baseline.evidence.1
        description: 关键目标和要求能够追溯到用户要求、正式材料或明确来源。
      - evidence_requirement_id: task-baseline.evidence.2
        description: 工作范围与不在范围内的事项表达清楚，没有依赖隐含假设维持任务成立。
      - evidence_requirement_id: task-baseline.evidence.3
        description: 对缺失、冲突和待确认信息进行显式记录，并说明其对后续工作的影响。
      - evidence_requirement_id: task-baseline.evidence.4
        description: 完成条件能够用于判断最终成果是否满足本次任务，而不是仅以“已完成工作”作为标准。

  - deliverable_id: execution-plan
    activity_id: execution-planning
    artifact_type: execution-plan
    description: >-
      执行方案。说明主要工作项、专业责任、必要输入、预期输出、依赖和并行关系、成果汇总方式、质量检查安排及交付顺序。
    evidence_requirements:
      - evidence_requirement_id: execution-plan.evidence.1
        description: 任务基线中的主要要求都有明确责任和预期成果承接，没有关键工作无人承担。
      - evidence_requirement_id: execution-plan.evidence.2
        description: 关键输入、依赖和前置条件真实存在或明确标注为待取得，没有把未知条件写成已满足。
      - evidence_requirement_id: execution-plan.evidence.3
        description: 可以独立开展的工作得到合理并行安排，需要汇总的成果说明一致性和交接要求。
      - evidence_requirement_id: execution-plan.evidence.4
        description: 质量检查对象和基本依据在执行前已经明确，不能完全留到成果完成后临时决定。

  - deliverable_id: candidate-result
    activity_id: work-execution
    artifact_type: candidate-result
    description: >-
      待验收成果包。包含本次任务要求的实际成果、必要中间结果、来源或输入索引、验证证据以及使用这些成果所需的说明。
      具体文件、数据、代码、报告、设计或其他交付形式由任务本身决定。
    evidence_requirements:
      - evidence_requirement_id: candidate-result.evidence.1
        description: 任务基线中的全部主要交付要求都落实到具体成果或明确说明无法完成的原因。
      - evidence_requirement_id: candidate-result.evidence.2
        description: 关键事实、数据、计算、引用、测试或其他可验证主张具有相应来源和证据。
      - evidence_requirement_id: candidate-result.evidence.3
        description: 多部分成果在版本、术语、数据口径、接口和相互引用上保持一致，不存在明显冲突或遗漏。
      - evidence_requirement_id: candidate-result.evidence.4
        description: 已知限制、未完成项和无法验证事项如实保留，没有包装成已经完成或已经通过。
      - evidence_requirement_id: candidate-result.evidence.5
        description: 成果能够被独立人员实际读取、运行、检查或使用，而不是只提供完成声明。

  - deliverable_id: delivery-package
    activity_id: final-delivery
    artifact_type: delivery-package
    description: >-
      正式交付包。包含完成必要修订后的最终成果、必要附件和来源、版本信息、使用或维护说明，以及需要接收方了解的限制和未解决事项。
    evidence_requirements:
      - evidence_requirement_id: delivery-package.evidence.1
        description: 正式交付内容与完成质量检查后的确定版本一致，没有混入过期或未经检查的候选成果。
      - evidence_requirement_id: delivery-package.evidence.2
        description: 文件、数据、附件和说明逐项对应，名称、版本和用途明确。
      - evidence_requirement_id: delivery-package.evidence.3
        description: 已知限制、适用条件和仍未解决事项得到明确披露，没有通过遗漏制造“全部完成”的假象。
      - evidence_requirement_id: delivery-package.evidence.4
        description: 接收方能够依据现有成果和说明完成预期使用、查阅或后续处理。

required_reviews:
  - review_id: plan-readiness-review
    deliverable_id: execution-plan
    description: >-
      执行准备评审。确认任务已经被正确理解，主要责任、交付、依赖和质量检查安排完整，
      不存在会使后续工作明显偏离目标的重大缺口或未经确认的关键假设。
    reviewer_capabilities:
      - artifact-review
    independent_agent: true
    criteria:
      - process_criterion_id: plan-readiness-review.criterion.1
        description: 执行方案与任务基线一致，主要目标和明确要求没有在计划阶段被遗漏或改变。
      - process_criterion_id: plan-readiness-review.criterion.2
        description: 主要工作、责任、输入和输出关系清楚，能够支持后续专业人员开展工作。
      - process_criterion_id: plan-readiness-review.criterion.3
        description: 关键依赖和待确认条件已经识别，不把尚未获得的重要信息默认为已具备。
      - process_criterion_id: plan-readiness-review.criterion.4
        description: 质量检查对象和基本验收依据已经明确，且与任务实际风险相匹配。
      - process_criterion_id: plan-readiness-review.criterion.5
        description: 方案没有增加明显无关的工作、交付或流程负担。

  - review_id: result-quality-review
    deliverable_id: candidate-result
    description: >-
      成果质量评审。由未承担该成果生产责任的人员依据任务基线和既定质量要求检查实际成果，
      判断需求覆盖、正确性、一致性、证据充分性和实际可用性；存在问题时明确需要修改的内容和复验条件。
    reviewer_capabilities:
      - artifact-review
    independent_agent: true
    criteria:
      - process_criterion_id: result-quality-review.criterion.1
        description: 主要任务要求均已落实到实际成果，没有以摘要、占位内容或完成声明替代缺失交付。
      - process_criterion_id: result-quality-review.criterion.2
        description: 关键事实、数据、计算、引用、测试或其他重要结论与已有证据一致且可追溯。
      - process_criterion_id: result-quality-review.criterion.3
        description: 多部分成果之间不存在影响使用的版本、接口、术语、数据口径或逻辑冲突。
      - process_criterion_id: result-quality-review.criterion.4
        description: 成果在目标使用场景下能够实际读取、运行、理解或使用，并满足任务明确提出的质量要求。
      - process_criterion_id: result-quality-review.criterion.5
        description: 未验证、未知和仍存在限制的事项已经明确披露，没有被错误表述为已通过。

  - review_id: delivery-readiness-review
    deliverable_id: delivery-package
    description: >-
      交付准备评审。确认正式交付包与已经完成质量检查的成果一致，版本清晰、文件完整、说明充分，
      不存在会导致接收方误用、读取错误或把候选版本当成正式成果的问题。
    reviewer_capabilities:
      - artifact-review
    independent_agent: true
    criteria:
      - process_criterion_id: delivery-readiness-review.criterion.1
        description: 正式交付包只包含确定版本及其必要附件，没有未经检查的候选版本混入。
      - process_criterion_id: delivery-readiness-review.criterion.2
        description: 交付清单、实际文件、版本和用途一致，接收方能够清楚识别正式成果。
      - process_criterion_id: delivery-readiness-review.criterion.3
        description: 必要的使用、查看、运行或维护说明已经提供，并与实际成果相符。
      - process_criterion_id: delivery-readiness-review.criterion.4
        description: 已知限制、适用条件和未解决事项已经随交付披露。
      - process_criterion_id: delivery-readiness-review.criterion.5
        description: 不存在仍会直接阻碍预期使用的已知问题。

workflow_rules:
  - rule_id: requirement-traceability
    description: >-
      从任务定义到正式交付保持主要要求的连续追溯；任何重要要求的删除、替换或弱化都必须有明确依据，
      不能在后续阶段无声消失。
    enforced_by: review

  - rule_id: independent-quality-review
    description: >-
      待交付的主要成果必须经过独立质量检查；成果生产者的自检可以作为证据，但不能替代独立评审。
    enforced_by: review

  - rule_id: controlled-rework
    description: >-
      评审发现的问题应返回实际责任方修订，并对受影响内容重新检查；未受影响且仍然有效的成果不因局部返工被无差别推翻。
    enforced_by: review

  - rule_id: version-consistency
    description: >-
      评审和正式交付均针对明确版本的成果；修订产生新版本后，旧版本的检查结论不能自动适用于新内容。
    enforced_by: review

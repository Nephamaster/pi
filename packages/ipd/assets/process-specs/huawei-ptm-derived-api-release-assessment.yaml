workflow_rules:
- rule_id: R-SOFTWARE-SCOPE
  description: 本文件是已发布的软件测试评价子型。ST 只选择，不删除必需工作；设计师不能将 NOT_READY 任务结论改成必须修产品的隐含新目标。 本条作为设计/语义评审责任；当前引擎未新增专门规则执行器。
  enforced_by: review
- rule_id: R-ROLE-ASSIGNMENT
  description: 按专业能力选员工并在设计时绑定版本；一个节点一个员工。候选角色只是能力匹配示例，不代表资源或授权已经可用。 本条作为设计/语义评审责任；当前引擎未新增专门规则执行器。
  enforced_by: review
- rule_id: R-FORWARD-DEPENDENCIES
  description: 将各活动的前置与指定准出写成真实输入/approval 绑定；前向图保持 DAG，返工单列。不得用工作区路径存在来判定输入有效。 本条作为设计/语义评审责任；当前引擎未新增专门规则执行器。
  enforced_by: review
- rule_id: R-PARALLEL-JOIN
  description: 功能、性能和安全三线在条件满足后并行；缺陷/质量评价必须汇聚三线各自准确版本，不能因其中一条通过而跳过另一条。 本条作为设计/语义评审责任；当前引擎未新增专门规则执行器。
  enforced_by: review
- rule_id: R-EVIDENCE-LINEAGE
  description: 要求、方案、用例、实际执行、缺陷、报告和评价保持引用；原始响应/日志可定位并脱敏。输入失效则相关下游批准不得沿用。 本条作为设计/语义评审责任；当前引擎未新增专门规则执行器。
  enforced_by: review
- rule_id: R-REWORK-NORMAL
  description: 评审 REWORK 是正常作业；反馈指出不合格提交和标准，原 Session 修订复审。局部打回不自动拒绝未受影响分支，旧轮次结果不得重新放行。 本条作为设计/语义评审责任；当前引擎未新增专门规则执行器。
  enforced_by: review
- rule_id: R-SEMANTIC-SEPARATION
  description: 结构化补正、测试框架故障、产品缺陷、质量返工与输入缺失分开。产品有缺陷的真实报告可以过审；未开展必需测试却写报告不得冒充完成。 本条作为设计/语义评审责任；当前引擎未新增专门规则执行器。
  enforced_by: review
- rule_id: R-IMMUTABLE-STANDARDS
  description: 固定用户验收及本轮准出标准，不以来源示例值/角色偏好覆盖；过程经验只为下一版本提供建议。 本条作为设计/语义评审责任；当前引擎未新增专门规则执行器。
  enforced_by: review
- rule_id: R-AUTHORIZED-EXECUTION
  description: 所有测试限定批准目标/流量/数据；生产、云、外部副作用须明确授权。Runtime 工具隔离和 Gate 控制不能由提示词声明替代。 本条作为设计/语义评审责任；当前引擎未新增专门规则执行器。
  enforced_by: review
- rule_id: R-COMPLETION
  description: Workflow 完成条件包含必需执行/评审及最终 D-S12/D-S13/D-S14。Run 成功只表示约定测试评价工作完成，不代表真实上线或企业 ADCP 通过。 本条作为设计/语义评审责任；当前引擎未新增专门规则执行器。
  enforced_by: review

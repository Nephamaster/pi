  evidence_requirements:
  - 输入版本、来源/路径、被测对象、采用方法和已执行范围清楚。
  - 每个结论关联可定位记录；真实结果、模拟、自述和计划分别标注。
  - 不删除失败或阻塞；秘密脱敏，原始证据完整引用而非无界复制对话。

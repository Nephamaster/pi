workflow_rules:
- rule_id: R-SOFTWARE-SCOPE
  description: This file is a published software test-assessment subtype. ST only selects it and does not delete 
    mandatory work. The Workflow Designer must not convert a NOT_READY task conclusion into an implicit new objective to
    repair the product. This is a design/semantic-review responsibility; the current engine has no dedicated rule 
    executor for it.
  enforced_by: review
- rule_id: R-ROLE-ASSIGNMENT
  description: Select employees by professional capability and bind exact versions during design; one employee per node.
    Candidate roles are capability-matching examples only and do not prove that resources or authorization are 
    available. This is a design/semantic-review responsibility; the current engine has no dedicated rule executor for 
    it.
  enforced_by: review
- rule_id: R-FORWARD-DEPENDENCIES
  description: Express each activity's prerequisites and required release conditions through real input/approval 
    bindings. Keep the forward graph a DAG and model rework separately. File existence in the workspace does not prove 
    that an input is valid. This is a design/semantic-review responsibility; the current engine has no dedicated rule 
    executor for it.
  enforced_by: review
- rule_id: R-PARALLEL-JOIN
  description: The functional, performance, and security lines run in parallel once their prerequisites are satisfied. 
    Defect and quality assessment must converge the exact valid version from all three lines; one passing line must not 
    skip another. This is a design/semantic-review responsibility; the current engine has no dedicated rule executor for
    it.
  enforced_by: review
- rule_id: R-EVIDENCE-LINEAGE
  description: Maintain traceability among requirements, strategies, cases, actual execution, defects, reports, and 
    assessment. Raw responses/logs remain locatable and sanitized. If an input becomes invalid, downstream approvals 
    that depend on it must not be reused. This is a design/semantic-review responsibility; the current engine has no 
    dedicated rule executor for it.
  enforced_by: review
- rule_id: R-REWORK-NORMAL
  description: Review REWORK is normal work. Feedback identifies the nonconforming Submission and standard, and the 
    original Session revises the work for re-review. Local rework does not automatically reject unaffected branches, and
    results from an old round must not regain release authority. This is a design/semantic-review responsibility; the 
    current engine has no dedicated rule executor for it.
  enforced_by: review
- rule_id: R-SEMANTIC-SEPARATION
  description: Keep structured-submission correction, test-framework failure, product defect, quality rework, and 
    missing input semantically separate. A truthful report showing product defects may pass review; a report that 
    pretends completion when mandatory tests were never run may not. This is a design/semantic-review responsibility; 
    the current engine has no dedicated rule executor for it.
  enforced_by: review
- rule_id: R-IMMUTABLE-STANDARDS
  description: Freeze user acceptance requirements and current-run release criteria. Source examples or role preferences
    must not override them; process lessons may only recommend changes for future versions. This is a 
    design/semantic-review responsibility; the current engine has no dedicated rule executor for it.
  enforced_by: review
- rule_id: R-AUTHORIZED-EXECUTION
  description: All testing is limited to approved targets, traffic, and data; production, cloud, or external side 
    effects require explicit authorization. Prompt statements cannot replace Runtime tool isolation or Gate control. 
    This is a design/semantic-review responsibility; the current engine has no dedicated rule executor for it.
  enforced_by: review
- rule_id: R-COMPLETION
  description: Workflow completion includes all mandatory execution/review work and final D-S12/D-S13/D-S14 outputs. Run
    success means the agreed testing-assessment work is complete; it does not mean actual production release or 
    enterprise ADCP approval. This is a design/semantic-review responsibility; the current engine has no dedicated rule 
    executor for it.
  enforced_by: review

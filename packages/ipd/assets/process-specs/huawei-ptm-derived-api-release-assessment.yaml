required_reviews:
- review_id: G-S01
  deliverable_id: D-S01
  description: 'Project-added professional release review: Test requirements and traceability. Candidate `agency-engineering-software-architect`;
    requires `technical-feasibility` and must be different from the producing employee. Check whether the report/plan is trustworthy,
    complete, and compliant with the frozen contract without forcing an optimistic professional conclusion. Reference only
    the sealed Submission and specified evidence from the current round.'
  reviewer_capabilities:
  - technical-feasibility
  independent_agent: true
  criteria:
  - process_criterion_id: G-S01.criterion.1
    description: Explicit user requirements map item by item to test requirements, with clear scope and version.
  - process_criterion_id: G-S01.criterion.2
    description: Observable results are consistent with their sources, with no invented target or relaxed requirement.
  - process_criterion_id: G-S01.criterion.3
    description: Provide a criterion-level conclusion, corresponding evidence, and unverified scope; defect locations 
      and the object that requires modification are explicit.
- review_id: G-S02
  deliverable_id: D-S02
  description: 'Project-added professional release review: Overall test strategy. Candidate `agency-testing-test-results-analyzer`;
    requires `test-evidence-review` and must be different from the producing employee. Check whether the report/plan is trustworthy,
    complete, and compliant with the frozen contract without forcing an optimistic professional conclusion. Reference only
    the sealed Submission and specified evidence from the current round.'
  reviewer_capabilities:
  - test-evidence-review
  independent_agent: true
  criteria:
  - process_criterion_id: G-S02.criterion.1
    description: All three professional verification lines have appropriate methods and boundaries; unit tests do not 
      substitute for all verification.
  - process_criterion_id: G-S02.criterion.2
    description: Limitations caused by missing data, environment, authorization, or metrics are explicit and are not 
      assumed testable.
  - process_criterion_id: G-S02.criterion.3
    description: Provide a criterion-level conclusion, corresponding evidence, and unverified scope; defect locations 
      and the object that requires modification are explicit.
- review_id: G-S03
  deliverable_id: D-S03
  description: 'Project-added professional release review: Test planning and responsibility allocation. Candidate `agency-testing-api-tester`;
    requires `test-strategy` and must be different from the producing employee. Check whether the report/plan is trustworthy,
    complete, and compliant with the frozen contract without forcing an optimistic professional conclusion. Reference only
    the sealed Submission and specified evidence from the current round.'

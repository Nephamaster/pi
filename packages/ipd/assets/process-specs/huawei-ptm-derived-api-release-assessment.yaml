  - test-strategy
  independent_agent: true
  criteria:
  - process_criterion_id: G-S03.criterion.1
    description: Each professional work item has capability fit and a clear deliverable, and inputs/convergence can be 
      represented in the Workflow graph.
  - process_criterion_id: G-S03.criterion.2
    description: Estimates are not automatic release thresholds; frozen conditions, normal rework, and resource gaps are
      explicit.
  - process_criterion_id: G-S03.criterion.3
    description: Provide a criterion-level conclusion, corresponding evidence, and unverified scope; defect locations 

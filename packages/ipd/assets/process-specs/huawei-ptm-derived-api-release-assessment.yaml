# 项目预置衍生规范；非华为官方内部模板，非运行时裁剪。
# 完整角色/阶段/交接指导保留在 description 中，兼容当前严格 ProcessSpec v1。
schema_version: 1
process_spec_id: huawei-ptm-derived-api-release-assessment
version: 1.0.0
name: IPD-PTM 衍生规范：API 软件版本测试与发布准备评价
description: |-
  来源：公开 IPD-PTM 的测试需求、策略、计划、特性设计、自动化、执行、缺陷分析和评价。该文件是项目明确发布的软件子型，不是华为官方原名模板，也不是 ST 对全范围规范的临场裁剪。
  任务边界：评估一个确定 API 软件版本的质量和发布准备；包含功能/集成、性能/软件稳定和应用安全三条验证线。最终交付测试与评价材料，不默认改产品、真实上线或要求所有测试变绿。NOT_READY 可能是正确而完整的交付。
  组织：测试专业由 API Tester、Performance Benchmarker、Application Security Engineer 和 Test Results Analyzer 分工；Project Shepherd 管测试计划与过程交接，不接管 Runtime；Software Architect、Code Reviewer、Security Architect、Product Manager 等按具体审查专长复核。原测试经理的组织责任被分解为专业整合及规划节点，非新增“万能测试经理”。这些是候选映射，设计师仍需按实际可用资产确定员工。
  首版约束：每个作业节点单员工/持续 Session；独立 reviewer 不等于另一回合自检；受控输入只取确定提交和指定 Gate 批准；返工回原 Session，单 Run 不改变标准。业务估计不是计算预算；不加 HITL、自动裁剪或资产自演进。
  图设计指导：S01→S02；S03 与 S04 可在总体策略准出后推进；S05/S06 后 S07 检查执行准备；S08/S09/S10 使用有效准备/方案并行；三条结果全部汇聚 S11→S12→S13→S14。该顺序是规范语义，由设计师填写真实 input/approval 关系，不假装当前 Compiler 会解析自然语言自动建边。
  证据语义：实现/计划产物的准出证明可使用；执行报告的准出证明结果记录完整可信；产品是否满足质量线由 S13 专业意见陈述。缺证据时允许形成证据不足的合格报告，但不能用它绕过本任务明确要求必须实际执行的工作；环境根本不可用而三条验证未开展则 Run 应阻塞。
  完整交付：所有必需活动和评审覆盖；S08—S10 有真实执行证据；S11—S14 完成；最终清单至少包括产品质量报告、发布准备评价、过程回顾和各专业证据索引。设计师在 Workflow completion 中表达必需节点和指定批准，不能只等待最后一份文件。
  范围排除：不包含物理样机/制造 SVT/材料可靠性；软件长稳测试不冒充这些原概念。也不提供修复至可上线的保证；需要修改产品的任务应使用另行设计并发布的产品改进规范。
source: |-
  项目工程转译自华为云 CodeArts TestPlan 公开 IPD-PTM；H1—H5 URL：
  H1 https://support.huaweicloud.com/usermanual-testman/cloudtest_01_1502.html
  H2 https://support.huaweicloud.com/usermanual-testman/cloudtest_01_1503.html
  H3 https://support.huaweicloud.com/usermanual-testman/cloudtest_01_1504.html
  H4 https://support.huaweicloud.com/usermanual-testman/cloudtest_01_1505.html
  H5 https://support.huaweicloud.com/usermanual-testman/cloudtest_01_1506.html
applicable_when:
- 任务明确要求对确定 API 软件版本开展功能/集成、性能/软件稳定和安全验证并交付质量与发布准备评价。
- 已有可解析需求和接口、被测版本、授权测试环境及数据；缺少执行前必要项时允许如实阻塞，不模拟完成。
- 能够匹配相应测试、安全、分析与审查员工，并在节点绑定实际工具/Skill/数据权限。
not_applicable_when:
- 只要求生成一份报告、PPT 或其他展示材料而不需要实际软件测试。
- 任务要求制造验证、物理可靠性、临床验证、法定认证或企业投资决策。
- 任务只需单一测试线，或要求修复产品直至上线；不可在 Run 中删除三线或添加隐式开发循环。
- 无法提供真实测试条件，打算用模拟结果替代实际验证。
required_activities:
- activity_id: S01
  description: |-
    测试需求与追溯
    来源关系：P01。工作细化与员工映射均为项目转译。
    专业责任：需 test-design；候选 agency-testing-api-tester，不是强制唯一员工。
    前置工作：用户原始任务、需求/接口材料、被测版本与待确认事实。使用对应已准出的确定提交，必要输入未齐不得假装就绪。
    作业：核对 API 需求、接口规格、质量要求和待评估版本；把测试对象、正常/负向行为和风险转为验证点。保留来源，未知预期不能由测试者自行补造。
    交付：D-S01；后续由指定独立评审准出，不由生产者自批。
  required_capabilities:
  - test-design
- activity_id: S02
  description: |-
    总体测试策略
    来源关系：P02。工作细化与员工映射均为项目转译。
    专业责任：需 test-strategy；候选 agency-testing-api-tester，不是强制唯一员工。
    前置工作：S01。使用对应已准出的确定提交，必要输入未齐不得假装就绪。
    作业：设计功能/集成、性能/稳定和应用安全三条必需专业线；定义环境、数据、观测、风险优先级及证据汇聚。冻结需求中已有阈值；方法性选择明确标注，不冒充用户事实。
    交付：D-S02；后续由指定独立评审准出，不由生产者自批。
  required_capabilities:
  - test-strategy
- activity_id: S03
  description: |-
    测试计划与职责分工
    来源关系：P03。工作细化与员工映射均为项目转译。
    专业责任：需 project-planning；候选 agency-project-management-project-shepherd，不是强制唯一员工。
    前置工作：S02。使用对应已准出的确定提交，必要输入未齐不得假装就绪。
    作业：把策略变成可交付 WBS：明确方法准备、用例、调试、各执行分支、缺陷汇聚和评价责任。安排可并行部分，不给节点设置 Token/时间预算，不自行调度。
    交付：D-S03；后续由指定独立评审准出，不由生产者自批。
  required_capabilities:
  - project-planning
- activity_id: S04
  description: |-
    特性分析与方案
    来源关系：P04/P05/P06；纯软件阶段表达为项目转译。工作细化与员工映射均为项目转译。
    专业责任：需 test-design；候选 agency-testing-api-tester，不是强制唯一员工。
    前置工作：S01, S02。使用对应已准出的确定提交，必要输入未齐不得假装就绪。
    作业：按特性细化状态、边缘、错误、对象/租户授权、兼容和依赖故障；定义阶段验证集合。可借用原型/系统验证思路，但不把软件测试写成制造 SVT。
    交付：D-S04；后续由指定独立评审准出，不由生产者自批。
  required_capabilities:
  - test-design
- activity_id: S05
  description: |-
    自动化方案与工具适配
    来源关系：P07/P08。工作细化与员工映射均为项目转译。
    专业责任：需 contract-testing；候选 agency-testing-api-tester，不是强制唯一员工。
    前置工作：S04。使用对应已准出的确定提交，必要输入未齐不得假装就绪。
    作业：评估可自动化部分及维护价值；优先使用已授权可用工具。必要适配仅围绕当前测试，验证参数、错误、输出与重跑，不新建无必要框架。
    交付：D-S05；后续由指定独立评审准出，不由生产者自批。
  required_capabilities:
  - contract-testing
- activity_id: S06
  description: |-
    用例、脚本与测试数据
    来源关系：P09/P10。工作细化与员工映射均为项目转译。
    专业责任：需 api-testing；候选 agency-testing-api-tester，不是强制唯一员工。
    前置工作：S04, S05。使用对应已准出的确定提交，必要输入未齐不得假装就绪。
    作业：实现正常、负向、幂等/并发和契约用例，准备合成或授权数据、fixture 和清理。锁定脚本及数据，不修改产品让测试变绿。
    交付：D-S06；后续由指定独立评审准出，不由生产者自批。
  required_capabilities:
  - api-testing
- activity_id: S07
  description: |-
    调试与执行准备
    来源关系：P11。工作细化与员工映射均为项目转译。
    专业责任：需 api-testing；候选 agency-testing-api-tester，不是强制唯一员工。
    前置工作：S03, S06。使用对应已准出的确定提交，必要输入未齐不得假装就绪。
    作业：对可用版本验证工具、用例、身份、数据和结果采集链；覆盖至少一个能确认链路工作的正向和负向条件。产品错误、脚本错误、环境故障分开，不修改预期掩盖故障。
    交付：D-S07；后续由指定独立评审准出，不由生产者自批。
  required_capabilities:
  - api-testing
- activity_id: S08
  description: |-
    功能与集成验证
    来源关系：P12 的 API 专业分解。工作细化与员工映射均为项目转译。
    专业责任：需 api-testing；候选 agency-testing-api-tester，不是强制唯一员工。
    前置工作：S07, S04。使用对应已准出的确定提交，必要输入未齐不得假装就绪。
    作业：在确定版本和环境执行功能、错误、契约、权限和依赖行为用例；维护状态与缺陷。原始请求响应脱敏，报告实际运行和未运行范围。
    交付：D-S08；后续由指定独立评审准出，不由生产者自批。
  required_capabilities:
  - api-testing
- activity_id: S09
  description: |-
    性能与软件稳定性验证
    来源关系：P12 的性能分解；不替代 P13 物理试验。工作细化与员工映射均为项目转译。
    专业责任：需 performance-testing；候选 agency-testing-performance-benchmarker，不是强制唯一员工。
    前置工作：S07, S02。使用对应已准出的确定提交，必要输入未齐不得假装就绪。
    作业：按批准目标和负载测量吞吐、延迟分布、错误和资源；适用时执行突发、耐久和恢复。限定环境及停止条件，保留基线与原始结果。
    交付：D-S09；后续由指定独立评审准出，不由生产者自批。
  required_capabilities:
  - performance-testing
- activity_id: S10
  description: |-
    应用安全验证
    来源关系：P12 的安全分解。工作细化与员工映射均为项目转译。
    专业责任：需 security-testing；候选 agency-security-appsec-engineer，不是强制唯一员工。
    前置工作：S07, S02。使用对应已准出的确定提交，必要输入未齐不得假装就绪。
    作业：围绕明确授权的 API 和代码做对象/租户授权、认证、输入、秘密和依赖安全检查。保留静态风险与实证发现的区别，不执行未授权攻击。
    交付：D-S10；后续由指定独立评审准出，不由生产者自批。
  required_capabilities:
  - security-testing
- activity_id: S11
  description: |-
    缺陷汇聚与影响分析
    来源关系：P14。工作细化与员工映射均为项目转译。
    专业责任：需 defect-analysis；候选 agency-testing-test-results-analyzer，不是强制唯一员工。
    前置工作：S08, S09, S10。使用对应已准出的确定提交，必要输入未齐不得假装就绪。
    作业：整合三条线的确定版本结果，去重缺陷而不丢失受影响用例；区分症状、根因证据、影响和修复建议。无修复节点时不得在本规范中擅自改产品。
    交付：D-S11；后续由指定独立评审准出，不由生产者自批。
  required_capabilities:
  - defect-analysis
- activity_id: S12
  description: |-
    产品质量测试报告
    来源关系：P15。工作细化与员工映射均为项目转译。
    专业责任：需 test-results-analysis；候选 agency-testing-test-results-analyzer，不是强制唯一员工。
    前置工作：S11。使用对应已准出的确定提交，必要输入未齐不得假装就绪。
    作业：以冻结要求汇总产品当前质量，将每项要求连接到用例、证据与缺陷。清楚说明发布要求满足、不满足和无法判断部分，不把过程总结混为产品证明。
    交付：D-S12；后续由指定独立评审准出，不由生产者自批。
  required_capabilities:
  - test-results-analysis
- activity_id: S13
  description: |-
    发布准备评价
    来源关系：P16；输出格式为项目新增。工作细化与员工映射均为项目转译。
    专业责任：需 release-assessment；候选 agency-testing-test-results-analyzer，不是强制唯一员工。
    前置工作：S12。使用对应已准出的确定提交，必要输入未齐不得假装就绪。
    作业：对产品是否满足本次规定的发布要求形成有条件意见：READY、NOT_READY 或 UNDETERMINED 是报告内容，不是 Runtime 枚举。只有资料足以支持时给 READY；已证缺陷或重要缺口明确反映。
    交付：D-S13；后续由指定独立评审准出，不由生产者自批。
  required_capabilities:
  - release-assessment
- activity_id: S14
  description: |-
    测试过程回顾
    来源关系：H5 过程经验总结；独立产物为项目新增。工作细化与员工映射均为项目转译。
    专业责任：需 project-planning；候选 agency-project-management-project-shepherd，不是强制唯一员工。
    前置工作：S13。使用对应已准出的确定提交，必要输入未齐不得假装就绪。
    作业：整理方法、环境、协作和返工中已观察到的有效/低效环节，为后续规范版本提出改进依据。本 Run 不改标准、角色或图以追认成功。
    交付：D-S14；后续由指定独立评审准出，不由生产者自批。
  required_capabilities:
  - project-planning
required_deliverables:
- deliverable_id: D-S01
  activity_id: S01
  artifact_type: test-management-artifact
  description: 要求—接口—风险—验证点矩阵；待确认事实及其阻塞范围。
  evidence_requirements:
  - 输入版本、来源/路径、被测对象、采用方法和已执行范围清楚。
  - 每个结论关联可定位记录；真实结果、模拟、自述和计划分别标注。
  - 不删除失败或阻塞；秘密脱敏，原始证据完整引用而非无界复制对话。
- deliverable_id: D-S02
  activity_id: S02
  artifact_type: test-management-artifact
  description: 总体测试策略；分层覆盖、环境与权限、固定判断依据、技术与业务结果区分。
  evidence_requirements:
  - 输入版本、来源/路径、被测对象、采用方法和已执行范围清楚。
  - 每个结论关联可定位记录；真实结果、模拟、自述和计划分别标注。
  - 不删除失败或阻塞；秘密脱敏，原始证据完整引用而非无界复制对话。
- deliverable_id: D-S03
  activity_id: S03
  artifact_type: test-management-artifact

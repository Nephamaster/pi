# Project-published derived specification; not an official Huawei internal template and not Runtime trimming.
# Full role/phase/handoff guidance remains in description while staying compatible with strict ProcessSpec v2.
schema_version: 2
process_spec_id: huawei-ptm-derived-api-release-assessment
version: 2.0.0
name: 'IPD-PTM Derived Specification: API Software Release Testing and Release-Readiness Assessment'
description: |-
  Source basis: public IPD-PTM practices for test requirements, strategy, planning, feature design, automation, execution, defect analysis, and evaluation. This file is an explicitly published software subtype created by the project. It is neither an official Huawei template under this name nor an ad-hoc Runtime trimming of the full-scope specification by ST.
  Task boundary: evaluate the quality and release readiness of one exact API software version through three required verification lines: functional/integration, performance/software stability, and application security. The final delivery is testing and assessment evidence. The process does not implicitly modify the product, perform real production release, or require every test to be green. A NOT_READY conclusion may be a correct and complete delivery.
  Organization: testing responsibilities are divided among API Tester, Performance Benchmarker, Application Security Engineer, and Test Results Analyzer. Project Shepherd manages testing plans and process handoffs without taking over Runtime. Software Architect, Code Reviewer, Security Architect, Product Manager, and others review according to specific expertise. The organizational responsibilities of the original Test Manager are decomposed into professional integration and planning work instead of introducing a universal test-manager Agent. These are candidate mappings only; the Workflow Designer must bind employees from actually available assets.
  First-version constraints: one employee and one persistent Session per work node; an independent reviewer is not another self-check pass; controlled inputs use exact Submissions and the required Gate approvals; rework returns to the original Session; standards do not change within a Run. Business estimates are not compute budgets. HITL, automatic ProcessSpec trimming, and asset self-evolution are out of scope.
  Graph-design guidance: S01→S02; S03 and S04 may proceed after the overall strategy is approved; S05/S06 lead to S07 execution-readiness checking; S08/S09/S10 run in parallel using valid preparation/strategy inputs; all three result lines converge through S11→S12→S13→S14. This sequence expresses process semantics. The Workflow Designer must create the real input/approval bindings; the current Compiler is not assumed to parse this natural-language text into edges automatically.
  Evidence semantics: approval of implementation/planning artifacts proves those plans/artifacts are usable; approval of execution reports proves the result records are complete and trustworthy. Whether the product meets the quality bar is stated by the professional opinion in S13. A report may legitimately state that evidence is insufficient, but it cannot use that fact to bypass work that this task explicitly requires to be executed. If the environment is fundamentally unavailable and all three required verification lines cannot be performed, the Run should block.
  Complete delivery: cover all mandatory activities and reviews; S08-S10 contain real execution evidence; S11-S14 are completed; the final set includes at least the product-quality report, release-readiness assessment, process retrospective, and evidence indexes for each professional line. Workflow completion must explicitly require the necessary nodes and approvals rather than waiting only for the final file.
  Scope exclusions: no physical prototype/manufacturing SVT or material reliability testing. Long-running software stability testing must not be presented as those original physical concepts. The process also does not guarantee repair until production release; tasks that require product modification should use a separately designed and published product-improvement ProcessSpec.
source: |-
  Project engineering translation of Huawei Cloud CodeArts TestPlan public IPD-PTM material; H1-H5 URLs:
  H1 https://support.huaweicloud.com/usermanual-testman/cloudtest_01_1502.html
  H2 https://support.huaweicloud.com/usermanual-testman/cloudtest_01_1503.html
  H3 https://support.huaweicloud.com/usermanual-testman/cloudtest_01_1504.html
  H4 https://support.huaweicloud.com/usermanual-testman/cloudtest_01_1505.html
  H5 https://support.huaweicloud.com/usermanual-testman/cloudtest_01_1506.html
default_executable: true
applicable_when:
- The task explicitly requires functional/integration, performance/software-stability, and security verification of one 
  exact API software version and delivery of quality and release-readiness assessments.
- Parsable requirements and interfaces, the tested version, an authorized test environment, and data are available. If a
  pre-execution prerequisite is missing, the process may truthfully block rather than simulate completion.
- Matching testing, security, analysis, and review employees are available, and the nodes can bind the actual tools, 
  Skills, data, and permissions required for execution.
not_applicable_when:
- The task only asks for a report, PPT, or other presentation artifact and does not require actual software testing.
- The task requires manufacturing verification, physical reliability, clinical validation, statutory certification, or 
  enterprise investment decisions.
- The task needs only one verification line or requires product repair until release. The three mandatory verification 
  lines must not be deleted or replaced by an implicit development loop within the Run.
- Real test conditions cannot be provided and simulated results would be used as substitutes for actual verification.
required_activities:
- activity_id: S01
  description: |-
    Test requirements and traceability
    Source mapping: P01. Work refinement and employee mapping are project translations.
    Professional responsibility: requires `test-design`; candidate `agency-testing-api-tester`, not the mandatory or only employee.
    Prerequisites: original user task, requirement/interface materials, tested version, and unresolved facts. Use the corresponding approved exact Submissions; do not pretend readiness when mandatory inputs are missing.
    Work: verify API requirements, interface specifications, quality requirements, and the version under assessment; convert target behavior, normal/negative behavior, and risks into verification points. Preserve sources, and do not invent unknown expected behavior.
    Deliverable: D-S01; downstream use requires the designated independent review, not producer self-approval.
  required_capabilities:
  - test-design
- activity_id: S02
  description: |-
    Overall test strategy
    Source mapping: P02. Work refinement and employee mapping are project translations.
    Professional responsibility: requires `test-strategy`; candidate `agency-testing-api-tester`, not the mandatory or only employee.
    Prerequisites: S01. Use the corresponding approved exact Submissions; do not pretend readiness when mandatory inputs are missing.
    Work: design three mandatory professional lines—functional/integration, performance/stability, and application security. Define environment, data, observability, risk priority, and evidence convergence. Preserve thresholds already fixed in the requirements and label methodological choices explicitly instead of presenting them as user facts.
    Deliverable: D-S02; downstream use requires the designated independent review, not producer self-approval.
  required_capabilities:
  - test-strategy
- activity_id: S03
  description: |-
    Test planning and responsibility allocation
    Source mapping: P03. Work refinement and employee mapping are project translations.
    Professional responsibility: requires `project-planning`; candidate `agency-project-management-project-shepherd`, not the mandatory or only employee.
    Prerequisites: S02. Use the corresponding approved exact Submissions; do not pretend readiness when mandatory inputs are missing.
    Work: turn the strategy into a deliverable-oriented WBS covering method preparation, cases, debugging, each execution branch, defect convergence, and assessment responsibilities. Arrange work that can proceed in parallel. Do not assign Token/time budgets to nodes or directly schedule execution.
    Deliverable: D-S03; downstream use requires the designated independent review, not producer self-approval.
  required_capabilities:
  - project-planning
- activity_id: S04
  description: |-
    Feature analysis and test solution
    Source mapping: P04/P05/P06; the software-only phase expression is a project translation. Work refinement and employee mapping are also project translations.
    Professional responsibility: requires `test-design`; candidate `agency-testing-api-tester`, not the mandatory or only employee.
    Prerequisites: S01 and S02. Use the corresponding approved exact Submissions; do not pretend readiness when mandatory inputs are missing.
    Work: refine feature states, boundaries, errors, object/tenant authorization, compatibility, and dependency failures, and define the phase verification set. Prototype/system-verification concepts may be borrowed where useful, but software testing must not be represented as manufacturing SVT.
    Deliverable: D-S04; downstream use requires the designated independent review, not producer self-approval.
  required_capabilities:
  - test-design
- activity_id: S05
  description: |-
    Automation plan and tool adaptation
    Source mapping: P07/P08. Work refinement and employee mapping are project translations.
    Professional responsibility: requires `contract-testing`; candidate `agency-testing-api-tester`, not the mandatory or only employee.
    Prerequisites: S04. Use the corresponding approved exact Submissions; do not pretend readiness when mandatory inputs are missing.
    Work: assess automatable scope and maintenance value, prioritizing authorized existing tools. Necessary adaptation is limited to the current tests and must validate parameters, errors, outputs, and rerun behavior without creating unnecessary infrastructure.
    Deliverable: D-S05; downstream use requires the designated independent review, not producer self-approval.
  required_capabilities:
  - contract-testing
- activity_id: S06
  description: |-
    Cases, scripts, and test data
    Source mapping: P09/P10. Work refinement and employee mapping are project translations.
    Professional responsibility: requires `api-testing`; candidate `agency-testing-api-tester`, not the mandatory or only employee.
    Prerequisites: S04 and S05. Use the corresponding approved exact Submissions; do not pretend readiness when mandatory inputs are missing.
    Work: implement positive, negative, idempotency/concurrency, and contract cases; prepare synthetic or authorized data, fixtures, and cleanup. Lock script/data versions and do not modify the product merely to make tests pass.
    Deliverable: D-S06; downstream use requires the designated independent review, not producer self-approval.
  required_capabilities:
  - api-testing
- activity_id: S07
  description: |-
    Debugging and execution readiness
    Source mapping: P11. Work refinement and employee mapping are project translations.
    Professional responsibility: requires `api-testing`; candidate `agency-testing-api-tester`, not the mandatory or only employee.
    Prerequisites: S03 and S06. Use the corresponding approved exact Submissions; do not pretend readiness when mandatory inputs are missing.
    Work: verify the tools, cases, identity, data, and result-collection chain against an available version, including at least one positive and one negative condition that demonstrate the execution path works. Distinguish product errors, script errors, and environment faults; do not change expected behavior merely to hide a failure.
    Deliverable: D-S07; downstream use requires the designated independent review, not producer self-approval.
  required_capabilities:
  - api-testing
- activity_id: S08
  description: |-
    Functional and integration verification
    Source mapping: API-specific decomposition of P12. Work refinement and employee mapping are project translations.
    Professional responsibility: requires `api-testing`; candidate `agency-testing-api-tester`, not the mandatory or only employee.
    Prerequisites: S07 and S04. Use the corresponding approved exact Submissions; do not pretend readiness when mandatory inputs are missing.
    Work: execute functional, error, contract, authorization, and dependency-behavior cases on the exact version and environment; maintain status and defect records. Sanitize raw requests/responses and report both the executed and unexecuted scope.
    Deliverable: D-S08; downstream use requires the designated independent review, not producer self-approval.
  required_capabilities:
  - api-testing
- activity_id: S09
  description: |-
    Performance and software-stability verification
    Source mapping: performance decomposition of P12; this does not replace P13 physical reliability testing. Work refinement and employee mapping are project translations.
    Professional responsibility: requires `performance-testing`; candidate `agency-testing-performance-benchmarker`, not the mandatory or only employee.
    Prerequisites: S07 and S02. Use the corresponding approved exact Submissions; do not pretend readiness when mandatory inputs are missing.
    Work: measure throughput, latency distributions, errors, and resources against approved targets and loads; when applicable, run burst, endurance, and recovery tests. Bound the environment and stop conditions and retain baseline and raw measurements.
    Deliverable: D-S09; downstream use requires the designated independent review, not producer self-approval.
  required_capabilities:
  - performance-testing
- activity_id: S10
  description: |-
    Application security verification
    Source mapping: security decomposition of P12. Work refinement and employee mapping are project translations.
    Professional responsibility: requires `security-testing`; candidate `agency-security-appsec-engineer`, not the mandatory or only employee.
    Prerequisites: S07 and S02. Use the corresponding approved exact Submissions; do not pretend readiness when mandatory inputs are missing.
    Work: within the explicitly authorized API/code scope, verify object/tenant authorization, authentication, input handling, secrets, and dependency security. Distinguish static risks from empirically observed findings and do not perform unauthorized attacks.
    Deliverable: D-S10; downstream use requires the designated independent review, not producer self-approval.
  required_capabilities:
  - security-testing
- activity_id: S11
  description: |-
    Defect convergence and impact analysis
    Source mapping: P14. Work refinement and employee mapping are project translations.
    Professional responsibility: requires `defect-analysis`; candidate `agency-testing-test-results-analyzer`, not the mandatory or only employee.
    Prerequisites: S08, S09, and S10. Use the corresponding approved exact Submissions; do not pretend readiness when mandatory inputs are missing.
    Work: integrate exact-version results from all three verification lines, deduplicate defects without losing affected cases, and distinguish symptoms, evidenced root causes, impact, and fix recommendations. If this ProcessSpec has no repair node, do not modify the product implicitly.
    Deliverable: D-S11; downstream use requires the designated independent review, not producer self-approval.
  required_capabilities:
  - defect-analysis
- activity_id: S12
  description: |-
    Product quality test report
    Source mapping: P15. Work refinement and employee mapping are project translations.
    Professional responsibility: requires `test-results-analysis`; candidate `agency-testing-test-results-analyzer`, not the mandatory or only employee.
    Prerequisites: S11. Use the corresponding approved exact Submissions; do not pretend readiness when mandatory inputs are missing.
    Work: summarize current product quality against frozen requirements, linking each requirement to cases, evidence, and defects. Clearly distinguish release requirements that are satisfied, unsatisfied, or indeterminate; do not confuse process summary with proof of product quality.
    Deliverable: D-S12; downstream use requires the designated independent review, not producer self-approval.
  required_capabilities:
  - test-results-analysis
- activity_id: S13
  description: |-
    Release-readiness assessment
    Source mapping: P16; the output format is a project addition. Work refinement and employee mapping are project translations.
    Professional responsibility: requires `release-assessment`; candidate `agency-testing-test-results-analyzer`, not the mandatory or only employee.
    Prerequisites: S12. Use the corresponding approved exact Submissions; do not pretend readiness when mandatory inputs are missing.
    Work: provide a conditional opinion on whether the product satisfies the release requirements defined for this task. READY, NOT_READY, and UNDETERMINED are report semantics, not Runtime enums. Use READY only when evidence is sufficient; confirmed defects and important gaps must remain explicit.
    Deliverable: D-S13; downstream use requires the designated independent review, not producer self-approval.
  required_capabilities:
  - release-assessment
- activity_id: S14
  description: |-
    Test-process retrospective
    Source mapping: H5 process-experience summary; the separate artifact is a project addition. Work refinement and employee mapping are project translations.
    Professional responsibility: requires `project-planning`; candidate `agency-project-management-project-shepherd`, not the mandatory or only employee.
    Prerequisites: S13. Use the corresponding approved exact Submissions; do not pretend readiness when mandatory inputs are missing.
    Work: summarize observed effective and ineffective aspects of methods, environment, collaboration, and rework, providing evidence for future ProcessSpec improvement. Do not change standards, roles, or the graph within this Run to retroactively justify success.
    Deliverable: D-S14; downstream use requires the designated independent review, not producer self-approval.
  required_capabilities:
  - project-planning

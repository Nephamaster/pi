required_reviews:
- review_id: G-S01
  deliverable_id: D-S01
  description: 项目新增专业准出：测试需求与追溯。候选 agency-engineering-software-architect，要求 technical-feasibility；须与生产员工不同。检查报告/方案是否可信、完整和符合固定契约，不强制其专业结论为乐观。仅引用本轮封存提交和规定证据。
  reviewer_capabilities:
  - technical-feasibility
  independent_agent: true
  criteria:
  - 用户明确要求与测试要求逐项对应，范围和版本明确。
  - 可观察结果与来源一致，未虚构目标或放宽要求。
  - 逐项给出结论、对应证据与未查部分；缺陷位置和要求修改的对象明确。
